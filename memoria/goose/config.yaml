    enabled: true
    env:
      NOTION_API_KEY: "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"
    timeout: 300
  bash:
    name: Bash
    type: stdio
    cmd: python3
    args:
    - /home/leo/mcp-servers/mcp-bash/server.py
