# ═══ PERFIL POWER ═══
# MÁXIMO PODER. Sin KREI-dropshipping.
# Developer + built-ins + MCP servers gratis
# MCPs via npx (zero-cache, se ejecutan al vuelo)

GOOSE_TELEMETRY_ENABLED: false
GOOSE_THINKING_EFFORT: off

active_provider: custom_deepseek
providers:
  custom_deepseek:
    enabled: true
    model: deepseek-chat
    configured: true

extensions:
  # ─── Built-in platform ───
  developer:
    enabled: true
    type: platform
    name: developer
    display_name: Developer
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    display_name: Extension Manager
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    display_name: Summon
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    display_name: Skills
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    display_name: Todo
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    display_name: Apps
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    display_name: Analyze
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    display_name: Top Of Mind
    bundled: true

  # ─── MCP Servers: Archivos y Búsqueda ───
  fetch:
    name: Fetch
    type: stdio
    cmd: mcp-server-fetch
    enabled: true
    timeout: 300
  filesystem:
    name: Filesystem
    type: stdio
    cmd: /home/leo/mcp-servers/servers/src/filesystem/dist/index.js
    enabled: true
    timeout: 300
  memory:
    name: Memory
    type: stdio
    cmd: /home/leo/mcp-servers/servers/src/memory/dist/index.js
    enabled: true
    timeout: 300

  # ─── MCP Servers: Razonamiento ───
  sequential-thinking:
    name: Sequential Thinking
    type: stdio
    cmd: /home/leo/mcp-servers/servers/src/sequentialthinking/dist/index.js
    enabled: true
    timeout: 300

  # ─── MCP Servers: Tiempo y Git ───
  time:
    name: Time
    type: stdio
    cmd: python3
    args:
    - -m
    - mcp_server_time
    enabled: true
    timeout: 300
  git:
    name: Git
    type: stdio
    cmd: python3
    args:
    - -m
    - mcp_server_git
    enabled: true
    timeout: 300

  # ─── MCP Servers: Navegación ───
  puppeteer:
    name: Puppeteer
    type: stdio
    cmd: /home/leo/mcp-servers/npm-packages/node_modules/.bin/mcp-server-puppeteer
    enabled: true
    envs:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    timeout: 300

  # ─── MCP Servers: Bash Nativo ───
  bash:
    name: Bash
    type: stdio
    cmd: python3
    args:
    - /home/leo/mcp-servers/mcp-bash/server.py
    enabled: true
    timeout: 300

  # ─── MCP Servers: Token-efficiency NLP (local, sin API key) ───
  blackmount-nlp:
    name: BlackMountNLP
    type: stdio
    cmd: python3
    args:
    - -m
    - blackmount_nlp_mcp
    enabled: true
    timeout: 300

  # ─── MCP Servers: Descubrimiento de otros MCPs ───
  a2asearch:
    name: A2ASearch
    type: stdio
    cmd: npx
    args:
    - -y
    - a2asearch-mcp
    enabled: true
    timeout: 60

  # ─── MCP Servers: Análisis de APIs ───
  clirank:
    name: CliRank
    type: stdio
    cmd: npx
    args:
    - -y
    - clirank-mcp-server
    enabled: true
    timeout: 60
