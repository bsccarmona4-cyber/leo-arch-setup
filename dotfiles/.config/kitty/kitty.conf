font_family      Fira Code
font_size        12.0

# Pastel Theme Colors
background            #0f0f14
foreground            #fdf6e3
selection_background  #d6b4fc
selection_foreground  #0f0f14

# Cursor
cursor                #aec6ff
cursor_text_color     #0f0f14

# Transparency (See wallpaper clearly but read code)
background_opacity    0.15
dynamic_background_opacity yes

# Normal / Bright colors
color0 #0f0f14
color8 #15151e
color1 #ff9b9b
color9 #ffb4a2
color2 #a6e3a1
color10 #b5e8b0
color3 #f9e2af
color11 #fae3b0
color4 #aec6ff
color12 #b4cbff
color5 #d6b4fc
color13 #dfbdfc
color6 #94e2d5
color14 #99e8da
color7 #fdf6e3
color15 #ffffff

# Transparencia del fondo (0.0 es invisible, 1.0 es sólido)
background_opacity 0.6

# Opcional: Quitarle el color de fondo para que tome el de Hyprland
dynamic_background_opacity yes
