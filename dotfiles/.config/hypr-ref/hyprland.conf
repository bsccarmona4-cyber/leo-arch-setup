# ============================================================================
#        CONFIGURACIÓN MAESTRA DE HYPRLAND (ESTABLE, LIMPIA Y UNIFICADA)
# =============================================================================

# --- MONITORES ---
monitor=,preferred,auto,1

# --- VARIABLES DEL SISTEMA ---
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun -show-icons
$browser = firefox

# --- VARIABLES DE ENTORNO ---
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# --- ARRANQUE AUTOMÁTICO DE SERVICIOS ---
exec-once = swayosd-server                                             # Servidor de animaciones OSD
exec-once = waybar                                                     # Barra superior de cristal
exec-once = swaync                                                     # Centro de notificaciones
exec-once = swaybg -i ~/.config/hypr/montana.jpg -m fill               # Fondo de pantalla de la montaña
exec-once = wl-paste --type text --watch cliphist store                # Historial de texto
exec-once = wl-paste --type image --watch cliphist store               # Historial de imágenes
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1  # Autenticación segura
exec-once = hyprctl setcursor Bibata-Modern-Classic 24                 # Forzar cursor premium
exec-once = blueman-applet

# --- DISTRIBUCIÓN DEL TECLADO Y RATÓN ---
input {
    kb_layout = latam 
    follow_mouse = 1

    sensitivity = 0.2
}

# --- BORDES Y DISEÑO GENERAL ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(a6a6a6ff) rgba(4d4d4dff) 45deg          # Degradado plata premium
    col.inactive_border = rgba(1a1a1aff)                               # Borde oscuro mate inactivo
    layout = dwindle
}

# --- ESTÉTIQUES DE VENTANA (LUJO SILENCIOSO) ---
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.35

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# --- ANIMACIONES CINEMATOGRÁFICAS (FÍSICA DE REBOTE) ---
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 50, liner, loop                       # El efecto de giro en el borde
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

# =============================================================================
# --- ATAJOS DE TECLADO (UNIFICADOS Y SEGUROS) ---
# =============================================================================

# Lanzamiento de Aplicaciones
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, X, exec, wlogout

# Gestión de Ventanas Activas
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,

# Historial del Portapapeles (Cliphist)
bind = $mainMod, H, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Navegación y Foco entre Ventanas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Gestión de Escritorios Virtuales (Workspaces)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Mover Ventanas a otros Escritorios
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Arrastre y Cambio de Tamaño con Ratón (Manteniendo Windows presionado)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# =============================================================================
# --- CONTROLES FÍSICOS DE HARDWARE (THINKPAD T430) ---
# =============================================================================

# Botones Físicos de Audio y Micrófono (Con Animación SwayOSD)
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Control de Brillo de Pantalla (Teclas Fn + F8 / Fn + F9)
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Control de Reproducción de Música
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Botón Especial Técnico (ThinkVantage)
bind = , XF86Launch1, exec, kitty

# =============================================================================
# --- CAPTURAS DE PANTALLA ---
# =============================================================================
# Win + S: Seleccionar área y editar (para guardar o rayar)
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f -

# Win + Shift + S: Seleccionar área y copiar directo al portapapeles (Rápido)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# --- Mis reglas personalizadas ---
exec-once = kitty --start-as=fullscreen -e cmatrix
