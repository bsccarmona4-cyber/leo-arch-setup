services:
  baileys-bot:
    build:
      context: ./docker
      dockerfile: Dockerfile.baileys
    container_name: guardian-whatsapp
    restart: unless-stopped
    volumes:
      - ./docker/session:/app/session
    environment:
      - ANALYZE_URL=${ANALYZE_URL:-http://localhost:3000/api/analyze}
      - NODE_ENV=production
    # Use host networking to access localhost:3000 directly
    network_mode: host
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
