name: Respaldo automático de la base de datos

on:
  schedule:
    # Se ejecuta todos los días a las 3:00 AM (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permito ejecutar el respaldo manualmente desde la interfaz de GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de respaldo
        run: python scripts/backup.py

      - name: Subir respaldo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backups/
          retention-days: 30

      - name: Guardar respaldo en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Respaldo automático $(date +'%Y-%m-%d %H:%M')"
          git push
