<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria POS — {% block titulo %}Inicio{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="sidebar">
    <div class="logo">Cafeteria POS</div>

    {% if session.rol == 'admin' %}
    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a>
    {% endif %}

    <a href="/ventas" class="nav-link {% if request.path == '/ventas' %}active{% endif %}">Punto de Venta</a>
    <a href="/productos" class="nav-link {% if request.path.startswith('/productos') %}active{% endif %}">Productos</a>
    <a href="/clientes" class="nav-link {% if request.path.startswith('/clientes') %}active{% endif %}">Clientes</a>

    {% if session.rol == 'admin' %}
    <a href="/lealtad" class="nav-link {% if request.path == '/lealtad' %}active{% endif %}">Lealtad</a>
    <a href="/reportes" class="nav-link {% if request.path == '/reportes' %}active{% endif %}">Reportes</a>
    {% endif %}

    <hr>
    <span class="user-info">{{ session.nombre }} <small>({{ session.rol }})</small></span>
    <a href="/logout" class="nav-link logout">Cerrar sesion</a>
</nav>

<main class="content">
    {% block contenido %}{% endblock %}
</main>

<script>
async function fetcher(url, opts={}) {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(r.statusText);
    return r.json();
}
function formatMoney(n) { return '$' + parseFloat(n).toLocaleString('es-MX', {minimumFractionDigits:2}); }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
