<script type="module">
import * as THREE from 'three';
import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import FearEngine from './FearEngine.js';
import {createZone1,createZone2,createZone3,createZone4,createZone5} from './Zones.js?v=7';
import TheVisitor from './TheVisitor.js';
import EyeSystem from './EyeSystem.js';
import VisitorAI from './VisitorAI.js';

// ═══════════════════════════════════════════════════════════════
//  AUDIO ENGINE (Web Audio API — sonido procedural)
// ═══════════════════════════════════════════════════════════════
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.ambientGain = null;
    this.stepGain = null;   // FIX #1: renombrado de this.step para no colisionar con método
    this.breathGain = null;
    this.heartbeatGain = null;
    this.entityPanner = null;
    this.entityGain = null;
    this.entityOsc1 = null;
    this.entityOsc2 = null;
    this.reverbNode = null;
    this.reverbGain = null;
    this.tentReverbBuffer = null;
    this.basementReverbBuffer = null;
    this.currentZone = 0;
    this.ready = false;
    this.fear = 0;
    this.lastStepTime = 0;
  }

  init() {
    if (this.ready) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.8;
      this.master.connect(this.ctx.destination);

      this.ambientGain = this.ctx.createGain();
      this.ambientGain.gain.value = 0.12;
      this.ambientGain.connect(this.master);

      this.stepGain = this.ctx.createGain();
      this.stepGain.gain.value = 0.08;
      this.stepGain.connect(this.master);

      this.breathGain = this.ctx.createGain();
      this.breathGain.gain.value = 0;
      this.breathGain.connect(this.master);

      this.heartbeatGain = this.ctx.createGain();
      this.heartbeatGain.gain.value = 0;
      this.heartbeatGain.connect(this.master);

      this.entityPanner = this.ctx.createPanner();
      this.entityPanner.panningModel = 'HRTF';
      this.entityPanner.distanceModel = 'inverse';
      this.entityPanner.refDistance = 1.0;
      this.entityPanner.maxDistance = 20.0;
      this.entityPanner.rolloffFactor = 1.2;
      this.entityPanner.connect(this.master);

      this.entityGain = this.ctx.createGain();
      this.entityGain.gain.value = 0;
      this.entityGain.connect(this.entityPanner);

      // Convolutor de reverberación procedimental
      this.reverbNode = this.ctx.createConvolver();
      this.reverbGain = this.ctx.createGain();
      this.reverbGain.gain.value = 0.15;
      this.reverbNode.connect(this.reverbGain);
      this.reverbGain.connect(this.master);

      this.tentReverbBuffer = this._createReverbBuffer(2.5, 2.0);
      this.basementReverbBuffer = this._createReverbBuffer(0.8, 3.0);
      this.reverbNode.buffer = this.tentReverbBuffer; // Iniciar con carpa

      this._startAmbient();
      this._startBreathing();
      this._startHeartbeat();
      this._startEntityDrone();
      this._scheduleHallucinations();
      this._scheduleCreaks();
      this.ready = true;
    } catch (e) {
      console.warn('AudioEngine init failed:', e.message);
      this.ready = true; // prevenir re-intentos
    }
  }

  _startAmbient() {
    if (!this.ctx) return;
    try {
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(Math.random(), 3);
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 180;
      const g = this.ctx.createGain();
      g.gain.value = 0.025;
      src.connect(f);
      f.connect(g);
      g.connect(this.ambientGain);
      src.start();
    } catch (e) {}
  }

  _scheduleCreaks() {
    if (!this.ctx) return;
    const doCreak = () => {
      try {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const f = this.ctx.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = 200 + Math.random() * 800;
        f.Q.value = 10;
        o.type = 'sine';
        o.frequency.value = 100 + Math.random() * 600;
        g.gain.setValueAtTime(0, this.ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.03 + Math.random() * 0.04, this.ctx.currentTime + 0.05);
        g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3 + Math.random() * 0.5);
        o.connect(f);
        f.connect(g);
        g.connect(this.master);
        if (this.reverbNode) g.connect(this.reverbNode);
        o.start();
        o.stop(this.ctx.currentTime + 1);
      } catch (e) {}
      setTimeout(doCreak, 4000 + Math.random() * 8000);
    };
    setTimeout(doCreak, 3000);
  }

  _startBreathing() {
    if (!this.ctx) return;
    try {
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 3, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const t = i / this.ctx.sampleRate;
        const b = Math.sin(t * Math.PI * 0.15);
        const n = (Math.random() * 2 - 1) * 0.5;
        d[i] = n * Math.max(0, b) * 0.4;
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const f = this.ctx.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 380;
      f.Q.value = 2;
      src.connect(f);
      f.connect(this.breathGain);
      src.start();
    } catch (e) {}
  }

  _startEntityDrone() {
    if (!this.ctx) return;
    try {
      this.entityOsc1 = this.ctx.createOscillator();
      this.entityOsc2 = this.ctx.createOscillator();
      
      this.entityOsc1.type = 'triangle';
      this.entityOsc1.frequency.setValueAtTime(55, this.ctx.currentTime);
      
      this.entityOsc2.type = 'sawtooth';
      this.entityOsc2.frequency.setValueAtTime(57.5, this.ctx.currentTime);
      
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(120, this.ctx.currentTime);
      
      this.entityOsc1.connect(filter);
      this.entityOsc2.connect(filter);
      filter.connect(this.entityGain);
      
      this.entityOsc1.start();
      this.entityOsc2.start();
    } catch(e) {
      console.warn("Failed to start entity drone:", e);
    }
  }

  updateEntityPosition(pos) {
    if (!this.ctx || !this.entityPanner) return;
    try {
      const now = this.ctx.currentTime;
      this.entityPanner.positionX.setValueAtTime(pos.x, now);
      this.entityPanner.positionY.setValueAtTime(pos.y, now);
      this.entityPanner.positionZ.setValueAtTime(pos.z, now);
    } catch(e) {}
  }

  updateListener(camera) {
    if (!this.ctx) return;
    try {
      const listener = this.ctx.listener;
      const pos = camera.position;
      
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
      
      const now = this.ctx.currentTime;
      if (listener.positionX) {
        listener.positionX.setValueAtTime(pos.x, now);
        listener.positionY.setValueAtTime(pos.y, now);
        listener.positionZ.setValueAtTime(pos.z, now);
        listener.forwardX.setValueAtTime(forward.x, now);
        listener.forwardY.setValueAtTime(forward.y, now);
        listener.forwardZ.setValueAtTime(forward.z, now);
        listener.upX.setValueAtTime(up.x, now);
        listener.upY.setValueAtTime(up.y, now);
        listener.upZ.setValueAtTime(up.z, now);
      } else {
        listener.setPosition(pos.x, pos.y, pos.z);
        listener.setOrientation(forward.x, forward.y, forward.z, up.x, up.y, up.z);
      }
    } catch(e) {}
  }

  _createReverbBuffer(duration, decay) {
    if (!this.ctx) return null;
    try {
      const rate = this.ctx.sampleRate;
      const len = rate * duration;
      const buf = this.ctx.createBuffer(2, len, rate);
      for (let channel = 0; channel < 2; channel++) {
        const data = buf.getChannelData(channel);
        for (let i = 0; i < len; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    } catch(e) {
      return null;
    }
  }

  updateAcoustics(zone) {
    if (!this.ctx || !this.reverbNode) return;
    if (this.currentZone === zone) return;
    this.currentZone = zone;
    
    try {
      const now = this.ctx.currentTime;
      if (zone === 1 || zone === 3) {
        this.reverbNode.buffer = this.tentReverbBuffer;
        this.reverbGain.gain.setTargetAtTime(0.22, now, 0.15);
      } else {
        this.reverbNode.buffer = this.basementReverbBuffer;
        this.reverbGain.gain.setTargetAtTime(0.10, now, 0.15);
      }
    } catch(e) {}
  }

  _startHeartbeat() {
    if (!this.ctx) return;
    
    const playThump = (freq, duration, volume, time) => {
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, time);
        osc.frequency.exponentialRampToValueAtTime(30, time + duration);
        
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(volume, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        
        osc.connect(gain);
        gain.connect(this.heartbeatGain);
        
        osc.start(time);
        osc.stop(time + duration);
      } catch (e) {}
    };

    const beatLoop = () => {
      if (!this.ready || !this.ctx) return;
      try {
        const fear = this.fear;
        if (fear > 0.25) {
          const now = this.ctx.currentTime;
          const fearFactor = (fear - 0.25) / 0.75;
          const bpm = 60 + fearFactor * 80;
          const interval = 60 / bpm;
          
          const vol = fearFactor * 0.55;
          this.heartbeatGain.gain.setTargetAtTime(vol, now, 0.1);
          
          // Double thump
          playThump(55, 0.12, 0.8, now);
          playThump(42, 0.15, 0.6, now + 0.15);
          
          setTimeout(beatLoop, interval * 1000);
        } else {
          const now = this.ctx.currentTime;
          this.heartbeatGain.gain.setTargetAtTime(0, now, 0.3);
          setTimeout(beatLoop, 500);
        }
      } catch (e) {
        setTimeout(beatLoop, 1000);
      }
    };
    
    beatLoop();
  }

  _scheduleHallucinations() {
    if (!this.ctx) return;
    const doHallucination = () => {
      if (!this.ready || !this.ctx) return;
      try {
        const fear = this.fear;
        if (fear > 0.5 && Math.random() < 0.7) {
          const now = this.ctx.currentTime;
          const type = Math.random();
          
          if (type < 0.5) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(7000 + Math.random() * 2000, now);
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.015, now + 1.5);
            gain.gain.setValueAtTime(0.015, now + 3.0);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 5.0);
            
            let lastNode = gain;
            if (panner) {
              panner.pan.setValueAtTime(Math.random() > 0.5 ? -0.8 : 0.8, now);
              gain.connect(panner);
              lastNode = panner;
            }
            lastNode.connect(this.master);
            osc.connect(gain);
            osc.start(now);
            osc.stop(now + 5.0);
          } else {
            const bufferSize = this.ctx.sampleRate * 2.0;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.pow(Math.random(), 2);
            }
            
            const src = this.ctx.createBufferSource();
            src.buffer = buffer;
            
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.Q.value = 5.0;
            filter.frequency.setValueAtTime(800, now);
            filter.frequency.exponentialRampToValueAtTime(300, now + 2.0);
            
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.04, now + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
            
            const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
            
            src.connect(filter);
            filter.connect(gain);
            
            let lastNode = gain;
            if (panner) {
              panner.pan.setValueAtTime(Math.random() > 0.5 ? 0.7 : -0.7, now);
              panner.pan.linearRampToValueAtTime(Math.random() > 0.5 ? -0.7 : 0.7, now + 2.0);
              gain.connect(panner);
              lastNode = panner;
            }
            
            lastNode.connect(this.master);
            if (this.reverbNode) lastNode.connect(this.reverbNode);
            src.start(now);
            src.stop(now + 2.0);
          }
        }
      } catch (e) {
        console.warn("Hallucination play error:", e);
      }
      setTimeout(doHallucination, 8000 + Math.random() * 12000);
    };
    
    setTimeout(doHallucination, 5000);
  }

  setFear(level) {
    this.fear = level;
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (this.breathGain) {
      try {
        this.breathGain.gain.linearRampToValueAtTime(level * 0.12, now + 0.5);
      } catch (e) {}
    }
    if (this.entityGain) {
      try {
        const targetVol = level * 0.6;
        this.entityGain.gain.setTargetAtTime(targetVol, now, 0.2);
      } catch (e) {}
    }
  }

  playStep(surface) {  // FIX #1: método renombrado para claridad
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastStepTime < 0.25) return;
    this.lastStepTime = now;
    try {
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.1, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      const freq = surface === 'sand' ? 120 : 200;
      for (let i = 0; i < d.length; i++) {
        const t = i / this.ctx.sampleRate;
        d[i] = (Math.exp(-t * 40) * 0.8 + (Math.random() * 2 - 1) * 0.2 +
                Math.sin(t * freq * Math.PI * 2) * Math.exp(-t * 20) * 0.3) * 0.3;
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const g = this.ctx.createGain();
      g.gain.value = 0.06 + this.fear * 0.02;
      src.connect(g);
      g.connect(this.stepGain);
      if (this.reverbNode) g.connect(this.reverbNode);
      src.start();
    } catch (e) {}
  }

  playGlitch() {
    if (!this.ctx) return;
    try {
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.05, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.random() * 0.5;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const g = this.ctx.createGain();
      g.gain.value = 0.1;
      src.connect(g);
      g.connect(this.master);
      src.start();
    } catch (e) {}
  }

  playScream() {
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const sGain = this.ctx.createGain();
      sGain.gain.setValueAtTime(0, now);
      sGain.gain.linearRampToValueAtTime(0.7, now + 0.05);
      sGain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
      sGain.connect(this.master);

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'peaking';
      filter.frequency.value = 2500;
      filter.Q.value = 4;
      filter.gain.value = 10;
      filter.connect(sGain);

      const osc1 = this.ctx.createOscillator();
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(450, now);
      osc1.frequency.linearRampToValueAtTime(80, now + 1.5);
      
      const osc2 = this.ctx.createOscillator();
      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(480, now);
      osc2.frequency.linearRampToValueAtTime(100, now + 1.6);

      const osc3 = this.ctx.createOscillator();
      osc3.type = 'triangle';
      osc3.frequency.setValueAtTime(1200, now);
      osc3.frequency.exponentialRampToValueAtTime(300, now + 1.2);

      const bufferSize = this.ctx.sampleRate * 1.5;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const noiseNode = this.ctx.createBufferSource();
      noiseNode.buffer = noiseBuffer;

      const noiseFilter = this.ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 1000;
      noiseFilter.Q.value = 2;
      
      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.4, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

      osc1.connect(filter);
      osc2.connect(filter);
      osc3.connect(filter);
      
      noiseNode.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(sGain);

      osc1.start(now);
      osc2.start(now);
      osc3.start(now);
      noiseNode.start(now);

      osc1.stop(now + 1.8);
      osc2.stop(now + 1.8);
      osc3.stop(now + 1.8);
      noiseNode.stop(now + 1.8);
    } catch (e) {
      console.warn("playScream failed:", e);
    }
  }

  startCarouselMusic() {
    if (!this.ctx) return;
    this.stopCarouselMusic();
    
    try {
      this.carouselGain = this.ctx.createGain();
      this.carouselGain.gain.setValueAtTime(0, this.ctx.currentTime);
      this.carouselGain.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime + 2.0); // fade in
      this.carouselGain.connect(this.master);
      
      this.carouselFilter = this.ctx.createBiquadFilter();
      this.carouselFilter.type = 'lowpass';
      this.carouselFilter.frequency.value = 500;
      this.carouselFilter.connect(this.carouselGain);

      // Melodía circense menor
      const notes = [
        293.66, 311.13, 349.23, 392.00, 415.30, 466.16, 440.00, 415.30,
        392.00, 349.23, 311.13, 293.66, 261.63, 293.66, 311.13, 349.23,
        392.00, 311.13, 293.66, 261.63, 246.94, 261.63, 293.66, 311.13,
        392.00, 415.30, 440.00, 466.16, 523.25, 493.88, 466.16, 440.00
      ];
      let noteIdx = 0;
      
      const playNote = () => {
        if (!this.carouselGain) return;
        try {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          
          o.type = 'sine';
          o.frequency.value = notes[noteIdx] * (1.0 + (Math.sin(this.ctx.currentTime * 12) * 0.012) + (Math.random() - 0.5) * 0.005);
          
          g.gain.setValueAtTime(0, this.ctx.currentTime);
          g.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + 0.05);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.65);
          
          o.connect(g);
          g.connect(this.carouselFilter);
          o.start();
          o.stop(this.ctx.currentTime + 0.7);
          
          noteIdx = (noteIdx + 1) % notes.length;
        } catch (e) {}
        
        this.carouselTimeout = setTimeout(playNote, 400);
      };
      
      playNote();
    } catch (e) {
      console.warn('Failed to start carousel music:', e);
    }
  }

  stopCarouselMusic() {
    if (this.carouselTimeout) {
      clearTimeout(this.carouselTimeout);
      this.carouselTimeout = null;
    }
    if (this.carouselGain) {
      try {
        const gainNode = this.carouselGain;
        gainNode.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.5);
        setTimeout(() => {
          try { gainNode.disconnect(); } catch (e) {}
        }, 1800);
      } catch (e) {}
      this.carouselGain = null;
      this.carouselFilter = null;
    }
  }

const vhsPass = new ShaderPass({
  name: 'VHS',
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    fear: { value: 0 },
    glitch: { value: 0 }
  },
  vertexShader: `
    varying vec2 v;
    void main() {
      v = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 v;
    uniform sampler2D tDiffuse;
    uniform float uTime, fear, glitch;
    
    float rnd(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    
    vec2 distort(vec2 uv) {
      vec2 d = uv - 0.5;
      float r2 = dot(d, d);
      // Distorsión de barril sutil (gran angular selfie de 24mm)
      return 0.5 + d * (1.0 + r2 * 0.08);
    }
    
    vec4 getBlurredColor(sampler2D tex, vec2 uv, float blurAmount) {
      vec4 color = texture2D(tex, uv);
      if (blurAmount <= 0.0) return color;
      
      // 5-tap radial blur para simular desenfoque f/1.8 de DoF
      color += texture2D(tex, uv + vec2(-0.3, 0.2) * blurAmount);
      color += texture2D(tex, uv + vec2(0.3, -0.2) * blurAmount);
      color += texture2D(tex, uv + vec2(-0.2, -0.3) * blurAmount);
      color += texture2D(tex, uv + vec2(0.2, 0.3) * blurAmount);
      return color / 5.0;
    }
    
    void main() {
      // 1. Distorsión de lente selfie
      vec2 uv = distort(v);
      
      // Tracking glitch
      if (glitch > 0.5 && rnd(uv + uTime) > 0.7) {
        uv.x += rnd(vec2(uv.y, uTime)) * 0.03 * glitch;
      }
      
      // 2. Aberración cromática (radial)
      float dist = length(uv - 0.5);
      float ab = (0.0012 + dist * 0.005) * (1.0 + fear * 3.0);
      
      // 3. Profundidad de campo radial (f/1.8 Bokeh desenfoque radial en bordes)
      float blurAmt = dist * dist * 0.016 * (1.0 + fear * 2.0);
      
      vec4 c;
      c.r = getBlurredColor(tDiffuse, uv + vec2(ab, 0.0), blurAmt).r;
      c.g = getBlurredColor(tDiffuse, uv, blurAmt).g;
      c.b = getBlurredColor(tDiffuse, uv - vec2(ab, 0.0), blurAmt).b;
      c.a = 1.0;
      
      // 4. Vignette
      float vig = 1.0 - dist * dist * (0.55 + fear * 0.85);
      c.rgb *= vig;
      
      // 5. Ruido continuo de sensor + estática de miedo
      float sensorNoise = (rnd(uv * 200.0 + uTime) - 0.5) * 0.025; // Grano continuo sutil
      float staticNoise = rnd(uv * 100.0 + uTime) * 0.06 * fear;   // Estática por miedo
      c.rgb += vec3(sensorNoise + staticNoise);
      
      // 6. Color Grading Profesional (Sombras negras ricas, medios beige cálido, luces crema dorado)
      c.rgb = pow(max(vec3(0.0), c.rgb), vec3(1.06));
      
      vec3 shadowColor = vec3(0.02, 0.015, 0.01); // negros ligeramente cálidos
      vec3 midColor = vec3(1.05, 0.95, 0.82);      // beige cálido
      vec3 highColor = vec3(1.0, 0.98, 0.93);      // crema dorado/bañado por sol
      
      c.rgb = mix(c.rgb + shadowColor, c.rgb * midColor, clamp(c.rgb * 1.6, 0.0, 1.0));
      c.rgb = mix(c.rgb, c.rgb * highColor, clamp((c.rgb - 0.48) * 2.0, 0.0, 1.0));
      
      // Desaturación por alto nivel de miedo
      if (fear > 0.5) {
        float gray = dot(c.rgb, vec3(0.299, 0.587, 0.114));
        c.rgb = mix(c.rgb, vec3(gray), fear * 0.4);
      }
      gl_FragColor = c;
    }
  `
});

function makeRedDoorWithLight(pos) {
  const doorGroup = new THREE.Group();

  // 1. TEXTURA DE LA PUERTA (Con paneles clásicos y pomo de bronce)
  const doorCanvas = document.createElement('canvas');
  doorCanvas.width = 512; doorCanvas.height = 1024;
  const dctx = doorCanvas.getContext('2d');
  
  // Base rojo madera cálida y realista
  dctx.fillStyle = '#801010';
  dctx.fillRect(0, 0, 512, 1024);
  
  // Grano de madera vertical
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * 512;
    dctx.strokeStyle = Math.random() > 0.5 ? `rgba(60,5,5,${0.15+Math.random()*0.2})` : `rgba(140,25,25,${0.08+Math.random()*0.12})`;
    dctx.lineWidth = 0.5 + Math.random() * 2;
    dctx.beginPath();
    dctx.moveTo(x, 0);
    let currX = x;
    for (let y = 0; y <= 1024; y += 32) {
      currX += Math.sin(y*0.01 + i)*0.8 + (Math.random()-0.5)*0.3;
      dctx.lineTo(currX, y);
    }
    dctx.stroke();
  }

  // Estructura de paneles de puerta clásica (sombras y luces para volumen)
  const drawBevelRect = (x, y, w, h, depth = 12) => {
    // Sombra interna superior e izquierda (oscura)
    dctx.fillStyle = 'rgba(30, 2, 2, 0.6)';
    dctx.fillRect(x, y, w, depth);
    dctx.fillRect(x, y, depth, h);
    
    // Brillo interna inferior y derecho (claro)
    dctx.fillStyle = 'rgba(160, 40, 40, 0.4)';
    dctx.fillRect(x, y + h - depth, w, depth);
    dctx.fillRect(x + w - depth, y, depth, h);

    // Fondo del panel (ligeramente más oscuro)
    dctx.fillStyle = 'rgba(40, 4, 4, 0.2)';
    dctx.fillRect(x + depth, y + depth, w - 2*depth, h - 2*depth);
  };

  // Dos paneles grandes verticales en la puerta
  drawBevelRect(40, 60, 432, 420, 16);
  drawBevelRect(40, 540, 432, 420, 16);
  
  // Pomo/manija de bronce
  dctx.fillStyle = '#b59238'; // Bronce
  dctx.beginPath();
  dctx.arc(450, 500, 14, 0, Math.PI * 2);
  dctx.fill();
  
  // Sombra del pomo
  dctx.fillStyle = 'rgba(0,0,0,0.5)';
  dctx.beginPath();
  dctx.arc(454, 504, 14, 0, Math.PI * 2);
  dctx.fill();
  dctx.fillStyle = '#d9b350';
  dctx.beginPath();
  dctx.arc(448, 498, 10, 0, Math.PI * 2);
  dctx.fill();

  const doorTex = new THREE.CanvasTexture(doorCanvas);

  // 2. TEXTURA DEL MARCO (Madera vertical simple)
  const frameCanvas = document.createElement('canvas');
  frameCanvas.width = 128; frameCanvas.height = 256;
  const fctx = frameCanvas.getContext('2d');
  fctx.fillStyle = '#661111'; // Un rojo madera más oscuro
  fctx.fillRect(0, 0, 128, 256);
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * 128;
    fctx.strokeStyle = Math.random() > 0.5 ? `rgba(40,3,3,0.2)` : `rgba(120,20,20,0.1)`;
    fctx.lineWidth = 0.5 + Math.random() * 1.5;
    fctx.beginPath();
    fctx.moveTo(x, 0);
    let currX = x;
    for (let y = 0; y <= 256; y += 16) {
      currX += Math.sin(y*0.02 + i)*0.4 + (Math.random()-0.5)*0.1;
      fctx.lineTo(currX, y);
    }
    fctx.stroke();
  }
  const frameTex = new THREE.CanvasTexture(frameCanvas);

  // Materiales realistas (con baja emisión para responder correctamente a las luces y sombras)
  const doorMat = new THREE.MeshStandardMaterial({ 
    map: doorTex, 
    color: 0xdd2222, // Rojo madera clásico vibrante bajo la luz
    emissive: 0x110000, 
    emissiveIntensity: 0.1, 
    roughness: 0.7 
  });
  
  const frameMat = new THREE.MeshStandardMaterial({ 
    map: frameTex, 
    color: 0x991111, 
    emissive: 0x110000, 
    emissiveIntensity: 0.1, 
    roughness: 0.8 
  });

  // Puerta + marco con posiciones locales corregidas y pivote para bisagra
  const doorPivot = new THREE.Group();
  doorPivot.position.set(-1, 0, 0); // Pivote en la bisagra izquierda (x = -1)
  doorGroup.add(doorPivot);

  // Panel principal de la puerta (más delgado, 3D real)
  const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(2.0, 3.2, 0.06), doorMat);
  doorMesh.position.set(1.0, 1.6, 0); // Desplazado 1 unidad en X para rotar sobre su bisagra
  doorMesh.castShadow = true;
  doorMesh.receiveShadow = true;
  doorPivot.add(doorMesh);

  // Molduras/Paneles en 3D para la puerta
  const panelW = 0.7;
  const panelH = 1.1;
  const panelDepth = 0.015;
  const panelMat = doorMat;

  // 4 paneles por lado: 2 arriba, 2 abajo
  const panelXCoords = [0.55, 1.45]; // relativo al pivote (-1 a 1 de la puerta)
  const panelYCoords = [0.8, 2.2];    // relativo a y = 0
  const panelZOffsets = [0.034, -0.034]; // caras frontal y trasera

  panelZOffsets.forEach(zOffset => {
    panelYCoords.forEach(yVal => {
      panelXCoords.forEach(xVal => {
        const panel = new THREE.Mesh(new THREE.BoxGeometry(panelW, panelH, panelDepth), panelMat);
        panel.position.set(xVal, yVal, zOffset);
        panel.castShadow = true;
        panel.receiveShadow = true;
        doorPivot.add(panel);
      });
    });
  });

  // Pomo de bronce (latón reflectante en 3D) en ambos lados de la puerta
  const brassMat = new THREE.MeshStandardMaterial({
    color: 0xffd700,
    metalness: 1.0,
    roughness: 0.1
  });
  const stemMat = new THREE.MeshStandardMaterial({
    color: 0xc5a059,
    metalness: 1.0,
    roughness: 0.2
  });

  // Posición del pomo: cerca del borde opuesto a la bisagra (x = 1.8 relativo al pivote), altura y = 1.5
  [-0.045, 0.045].forEach(zSign => {
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.05), stemMat);
    stem.rotation.x = Math.PI / 2;
    stem.position.set(1.8, 1.5, zSign);
    stem.castShadow = true;
    doorPivot.add(stem);

    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 12), brassMat);
    knob.position.set(1.8, 1.5, zSign * 1.5);
    knob.castShadow = true;
    doorPivot.add(knob);
  });

  doorGroup.userData.doorPivot = doorPivot;
  doorGroup.userData.doorMesh = doorMesh;
  
  // Marco de la puerta en 3D detallado (3 vigas independientes)
  const frameThick = 0.08;
  const frameDepth = 0.20;

  // Jambas laterales
  const frameL = new THREE.Mesh(new THREE.BoxGeometry(frameThick, 3.28, frameDepth), frameMat);
  frameL.position.set(-1.0 - frameThick/2, 1.64, 0);

  frameL.receiveShadow = true;

  const frameR = new THREE.Mesh(new THREE.BoxGeometry(frameThick, 3.28, frameDepth), frameMat);
  frameR.position.set(1.0 + frameThick/2, 1.64, 0);
  frameR.castShadow = true;
  frameR.receiveShadow = true;
  doorGroup.add(frameR);

  // Cabezal superior
  const frameTop = new THREE.Mesh(new THREE.BoxGeometry(2.0 + frameThick * 2, frameThick, frameDepth), frameMat);
  frameTop.position.set(0, 3.24, 0);
  frameTop.castShadow = true;
  frameTop.receiveShadow = true;
  doorGroup.add(frameTop);

  // Lámpara física (soporte metálico + reflector/cacerola + bombilla)
  const metalMat = new THREE.MeshStandardMaterial({
    color: 0x222222,
    metalness: 0.8,
    roughness: 0.3
  });
  
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.15, 8), metalMat);
  rod.position.set(0, 3.325, 0.1);
  rod.rotation.x = Math.PI / 2;
  doorGroup.add(rod);

  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.12, 8, 1, true), metalMat);
  cap.position.set(0, 3.22, 0.18);
  cap.rotation.x = 0; // Caperuza recta hacia abajo
  doorGroup.add(cap);

  const bulbMat = new THREE.MeshStandardMaterial({
    color: 0x333333,
    emissive: 0xffeedd,
    emissiveIntensity: 5.0,
    roughness: 0.1
  });
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), bulbMat.clone());
  bulb.position.set(0, 3.17, 0.185);
  doorGroup.add(bulb);
  doorGroup.userData.bulbMesh = bulb;

  // Luces: SpotLight más ancho apuntando hacia abajo y levemente atrás (para bañar toda la superficie de la puerta)
  const spot = new THREE.SpotLight(0xffeedd, 10.0, 6, Math.PI/3, 0.6, 1.2);
  spot.position.set(0, 3.17, 0.185); spot.target.position.set(0, 0, 0.15);
  doorGroup.add(spot.target); doorGroup.add(spot);

  // Estela de luz 3D (Haz volumétrico con forma de MEDIO cilindro centrado y proyectado verticalmente)
  try {
    const bc = document.createElement('canvas');
    bc.width = 128; bc.height = 256;
    const bctx = bc.getContext('2d');
    const g = bctx.createLinearGradient(64, 0, 64, 256);
    g.addColorStop(0, 'rgba(255, 238, 200, 0.45)'); 
    g.addColorStop(0.15, 'rgba(255, 238, 200, 0.2)');
    g.addColorStop(0.5, 'rgba(255, 238, 200, 0.08)'); 
    g.addColorStop(1, 'rgba(255, 238, 200, 0)');
    bctx.fillStyle = g; bctx.fillRect(0, 0, 128, 256);
    
    // Baked high-resolution dust motes
    for (let i = 0; i < 150; i++) {
      bctx.beginPath();
      bctx.arc(16 + Math.random() * 96, Math.random() * 240, 0.8 + Math.random() * 2.5, 0, Math.PI * 2);
      bctx.fillStyle = `rgba(255, 250, 235, ${0.12 + Math.random() * 0.4})`;
      bctx.fill();
    }
    const btex = new THREE.CanvasTexture(bc);
    btex.wrapS = THREE.RepeatWrapping;
    btex.wrapT = THREE.ClampToEdgeWrapping;

    const beamHeight = 3.17;
    // Medio cilindro que mira al frente (Z+) y centrado en X
    const beamGeo = new THREE.CylinderGeometry(0.03, 0.65, beamHeight, 16, 1, true, -Math.PI / 2, Math.PI);
    beamGeo.translate(0, -beamHeight/2, 0); // pivote en la parte superior

    const beamMat = new THREE.MeshBasicMaterial({
      map: btex,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      opacity: 0.95
    });
    
    const beamMesh = new THREE.Mesh(beamGeo, beamMat);
    // Posicionado exactamente bajo el reflector de la lámpara (z = 0.18)
    beamMesh.position.set(0, 3.17, 0.18);
    beamMesh.rotation.x = 0; // Cae recto verticalmente hacia abajo, sin inclinación lateral o frontal
    doorGroup.add(beamMesh);
    doorGroup.userData.beamMesh = beamMesh;
  } catch(e) { console.warn('beam 3D fail:',e); }

  doorMat.color.setHex(0xdd2222); doorMat.emissive.setHex(0x110000); doorMat.emissiveIntensity = 0.1;
  doorGroup.userData.flickerPhase = Math.random()*100;
  doorGroup.userData.flickerSpeed = 3+Math.random()*2;
  doorGroup.position.copy(pos);
  scene.add(doorGroup);
  return doorGroup;
}

// ═══════════════════════════════════════════════════════════════
const maxBreathParticles = 30;
const breathGeo = new THREE.BufferGeometry();
const breathPos = new Float32Array(maxBreathParticles * 3);
const breathColors = new Float32Array(maxBreathParticles * 3);
const breathVels = [];
const breathLifes = [];

for (let i = 0; i < maxBreathParticles; i++) {
  // Ocultar inicialmente lejos
  breathPos[i * 3] = 0;
  breathPos[i * 3 + 1] = -9999;
  breathPos[i * 3 + 2] = 0;
  
  breathColors[i * 3] = 0;
  breathColors[i * 3 + 1] = 0;
  breathColors[i * 3 + 2] = 0;
  
  breathVels.push(new THREE.Vector3());
  breathLifes.push(0);
}

breathGeo.setAttribute('position', new THREE.BufferAttribute(breathPos, 3));
breathGeo.setAttribute('color', new THREE.BufferAttribute(breathColors, 3));

const breathMat = new THREE.PointsMaterial({
  size: 0.12,
  vertexColors: true,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const breathPoints = new THREE.Points(breathGeo, breathMat);
scene.add(breathPoints);

let breathTimer = 0;

function triggerColdBreath() {
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  
  // Posicionamiento de spawn ligeramente al frente y abajo de la mirada (boca)
  const spawnPos = camera.position.clone()
    .addScaledVector(dir, 0.2)
    .addScaledVector(up, -0.15);
    
  let spawned = 0;
  const posAttr = breathPoints.geometry.attributes.position;
  const colorAttr = breathPoints.geometry.attributes.color;
  
  for (let i = 0; i < maxBreathParticles; i++) {
    if (breathLifes[i] <= 0) {
      breathLifes[i] = 1.8;
      
      const px = spawnPos.x + (Math.random() - 0.5) * 0.05;
      const py = spawnPos.y + (Math.random() - 0.5) * 0.05;
      const pz = spawnPos.z + (Math.random() - 0.5) * 0.05;
      posAttr.setXYZ(i, px, py, pz);
      
      // Color inicial gris/blanco
      const initBrightness = 0.15 + Math.random() * 0.05;
      colorAttr.setXYZ(i, initBrightness, initBrightness, initBrightness);
      
      // Velocidad de dispersión cónica
      const vel = dir.clone().multiplyScalar(0.4 + Math.random() * 0.25)
        .addScaledVector(right, (Math.random() - 0.5) * 0.18)
        .addScaledVector(up, 0.08 + Math.random() * 0.15);
      breathVels[i].copy(vel);
      
      spawned++;
      if (spawned >= 10) break;
    }
  }
  posAttr.needsUpdate = true;
  colorAttr.needsUpdate = true;
}

//  MATERIALIZACIÓN PROGRESIVA DEL VISITOR
// ═══════════════════════════════════════════════════════════════
function updateMaterialization(fearLevel) {
  const phase = Math.min(1, fearLevel * 1.2);
  visitor.traverseMeshes((mesh) => {
    if (!mesh.userData._matBackup) {
      mesh.userData._matBackup = true;
      mesh.material = mesh.material.clone();
      mesh.material.transparent = true;
    }
    mesh.material.opacity = Math.min(1, phase + 0.3);
    if (mesh.material.emissive) mesh.material.emissiveIntensity = phase * 2;
  });
  eyeSystem.setActPhase(Math.min(3, phase * 3));
}

//  GLITCH VISUAL
// ═══════════════════════════════════════════════════════════════
function triggerGlitch() {
  if (!glitchEl) return;
  glitchEl.classList.add('activo');
  if (typeof vhsPass !== 'undefined' && vhsPass.uniforms && vhsPass.uniforms.glitch) {
    vhsPass.uniforms.glitch.value = 1.0;
  }
  let frames = 3 + Math.floor(Math.random() * 4);
  const doGlitch = () => {
    if (frames <= 0) {
      glitchEl.classList.remove('activo');
      glitchEl.style.transform = '';
      if (typeof vhsPass !== 'undefined' && vhsPass.uniforms && vhsPass.uniforms.glitch) {
        vhsPass.uniforms.glitch.value = 0.0;
      }
      return;
    }
    glitchEl.style.transform = `translateY(${(Math.random() - 0.5) * 40}px)`;
    glitchEl.style.background = `rgba(${Math.random() > 0.5 ? 255 : 100},${Math.random() * 155 + 50},${Math.random() * 100 + 50},${0.3 + Math.random() * 0.5})`;
    frames--;
    setTimeout(doGlitch, 20 + Math.random() * 40);
  };
  doGlitch();
  audio.playGlitch();
}

// ═══════════════════════════════════════════════════════════════
//  ZONE TRANSITIONS — FIX #5: teletransportar cámara
// ═══════════════════════════════════════════════════════════════
function changeZone(nz) {
  zone = nz;
  const zonePos = ZONE_POSITIONS[nz];
  
  // Mostrar solo la zona activa para evitar traslapes visuales y mejorar rendimiento
  z1.visible = (nz === 1);
  z2.visible = (nz === 2);
  z3.visible = (nz === 3);
  z4.visible = (nz === 4);
  
  if (typeof door1 !== 'undefined') door1.visible = (nz === 1 || nz === 2);
  if (typeof door2 !== 'undefined') door2.visible = (nz === 2);
  if (typeof door3 !== 'undefined') door3.visible = (nz === 2);
  if (typeof door4 !== 'undefined') door4.visible = (nz === 3);
  
  // Control de música de zonas
  if (nz === 1) {
    try { audio.startCarpaMusic(); } catch(e) {}
    try { audio.stopPasilloMusic(); } catch(e) {}
    try { audio.stopZona3Music(); } catch(e) {}
  } else if (nz === 2) {
    try { audio.startPasilloMusic(); } catch(e) {}
    try { audio.stopCarpaMusic(); } catch(e) {}
    try { audio.stopZona3Music(); } catch(e) {}
  } else if (nz === 3) {
    try { audio.startZona3Music(); } catch(e) {}
    try { audio.stopCarpaMusic(); } catch(e) {}
    try { audio.stopPasilloMusic(); } catch(e) {}
  } else {
    try { audio.stopCarpaMusic(); } catch(e) {}
    try { audio.stopPasilloMusic(); } catch(e) {}
    try { audio.stopZona3Music(); } catch(e) {}
  }

  // Control de música de carrusel procedural
  if (nz === 4) {
    try { audio.startCarouselMusic(); } catch(e) {}
  } else {
    try { audio.stopCarouselMusic(); } catch(e) {}
  }

  if (nz === 3) {
    // Teletransportar al jugador justo dentro de la entrada del Exterior Falso (Zona 4)
    camera.position.set(zonePos.x, 1.6, 58.0);
    
    // Cambiar iluminación a exterior
    ambient.color.setStyle('#ffffff');
    ambient.intensity = 0.65;
    moonLight.color.setHex(0xfff5e0);
    moonLight.intensity = 0.5;
    scene.fog = new THREE.FogExp2(0xd0e8ff, 0.005);
  } else if (nz === 4) {
    // Teletransportar jugador a la entrada de la Zona 4
    camera.position.set(zonePos.x, 1.6, zonePos.z + 20.0);
    camera.lookAt(zonePos.x, 1.6, zonePos.z - 10.0);

    // Iluminación muy tenue de sótano
    ambient.color.setStyle('#111122');
    ambient.intensity = 0.05;
    moonLight.intensity = 0.02;
    scene.fog = new THREE.FogExp2(0x020205, 0.045);

    sub('Los camerinos subterráneos... huele a sangre y humedad.', 5000);
  } else {
    // Teletransportar cámara al centro de la nueva zona
    if (nz === 2) {
      camera.position.set(zonePos.x + 26.0, 1.6, zonePos.z);
      camera.lookAt(zonePos.x, 1.6, zonePos.z);
    } else {
      camera.position.set(zonePos.x, 1.6, zonePos.z - 5);
    }
    
    if (nz === 1) {
      ambient.color.setStyle('#8B6914');
      ambient.intensity = 1.5;
      moonLight.color.setStyle('#4466aa');
      moonLight.intensity = 1.0;
      scene.fog = new THREE.FogExp2(0x07080a, 0.012);
    } else if (nz === 2) {
      ambient.color.setStyle('#1a2a4a');
      ambient.intensity = 1.0;
      moonLight.color.setStyle('#4466aa');
      moonLight.intensity = 1.0;
      scene.fog = new THREE.FogExp2(0x07080a, 0.015);
    }
  }

  // Mover visitor detrás del jugador
  if (nz === 4) {
    currentBasementFloor = 1;
    visitor.position.set(zonePos.x, 0, zonePos.z - 35.0);
    visitor.rotation.y = Math.PI; // Looking at the player
    visitor.visible = true;
    visitorLight.visible = true;
  } else {
    visitor.position.set(zonePos.x, 0, zonePos.z + 8);
    visitor.visible = true;
    visitorLight.visible = true;
  }

  // UI
  const names = { 1: 'CARPA PRINCIPAL', 2: 'PASILLO / CAMERINOS', 3: 'EXTERIOR FALSO', 4: 'CAMERINOS DEL CIRCO' };
  zonaEl.textContent = names[nz] || `ZONA ${nz}`;
  zonaEl.classList.add('mostrar');
  setTimeout(() => zonaEl.classList.remove('mostrar'), 4000);
}

//  INTERACT — FIX #13: posiciones coherentes
// ═══════════════════════════════════════════════════════════════
function interact() {
  const zp = ZONE_POSITIONS[zone];
  if (zone === 1) {
    // Puerta entre postes (ángulo π/8) — coincide con door1Pos
    const doorPos = new THREE.Vector3(
      zp.x + 13.5 * Math.sin(Math.PI / 8),
      1.6,
      zp.z + 13.5 * Math.cos(Math.PI / 8)
    );
    if (camera.position.distanceTo(doorPos) < 5) {
      changeZone(2);
      sub('Transición a Pasillo...', 3000);
    }
  } else if (zone === 2) {
    // Abrir door3 (al final del pasillo lateral, localZ ≈ -13)
    const localX = camera.position.x - zp.x;
    const localZ = camera.position.z - zp.z;
    if (Math.abs(localX) < 1.2 && localZ < -11.0) {
      if (door3 && !door3.userData.isOpen && !door3.userData.isOpening) {
        door3.userData.isOpening = true;
        sub('La puerta cruje al abrirse lentamente...', 4000);
      }
    }
  } else if (zone === 3) {
    // Abrir door4 (en la fachada de la casa azul) e ingresar a la Zona 4
    const distToDoor4 = camera.position.distanceTo(door4Pos);
    if (distToDoor4 < 4.0) {
      if (door4) {
        if (!door4.userData.isOpen && !door4.userData.isOpening) {
          door4.userData.isOpening = true;
          sub('La puerta de la casa azul cruje al abrirse...', 3000);
          // Retardar transición para ver el inicio del giro de la puerta
          setTimeout(() => {
            changeZone(4);
          }, 1200);
        } else {
          // Entrar de inmediato si ya está abierta o abriéndose
          changeZone(4);
        }
      }
    }
  } else if (zone === 4) {
    if (currentBasementFloor === 1) {
      const deskPos = new THREE.Vector3(zp.x - 3.5, 0.375, zp.z + 12);
      const elevPos = new THREE.Vector3(zp.x + 1.15, 1.5, zp.z - 54.5);
      if (camera.position.distanceTo(deskPos) < 3.5) {
        const code = prompt("Introduzca el código de combinación de 3 dígitos:");
        if (code === "815") {
          hasFloor1Key = true;
          sub("¡El cajón se abre! Has encontrado la Llave del Ascensor.", 4000);
          try { audio.playGlitch(); } catch(e) {}
        } else {
          sub("El candado no se abre. Código incorrecto.", 3000);
        }
      } else if (camera.position.distanceTo(elevPos) < 3.5) {
        if (hasFloor1Key) {
          openElevatorDoors(1);
          setTimeout(() => {
            transitionToNextFloor(2);
          }, 1500);
        } else {
          sub("El ascensor está cerrado. Necesitas una llave.", 3000);
        }
      }
    } else if (currentBasementFloor === 2) {
      const padlockPos = new THREE.Vector3(zp.x + 2.6, 15.0 + 0.7, zp.z - 16.4);
      const fusePos = new THREE.Vector3(zp.x + 1.15, 15.0 + 1.6, zp.z - 38.0);
      const elevPos = new THREE.Vector3(zp.x + 1.15, 15.0 + 1.5, zp.z - 54.5);
      
      if (camera.position.distanceTo(padlockPos) < 3.5 && !hasFloor2Fuse) {
        const code = prompt("Introduzca el código del candado (2 dígitos):");
        if (code === "50") {
          hasFloor2Fuse = true;
          sub("El candado se rompe. Has recogido el Fusible de Energía.", 4000);
          removePadlockMesh();
          try { audio.playGlitch(); } catch(e) {}
        } else {
          sub("Código incorrecto.", 3000);
        }
      } else if (camera.position.distanceTo(fusePos) < 3.5 && !floor2PowerRestored) {
        if (hasFloor2Fuse) {
          floor2PowerRestored = true;
          sub("Colocas el fusible. La energía del ascensor ha sido restablecida.", 4000);
          insertFuseMesh();
          try { audio.playGlitch(); } catch(e) {}
        } else {
          sub("La caja de fusibles está vacía. Falta un fusible de 50 amperios.", 3000);
        }
      } else if (camera.position.distanceTo(elevPos) < 3.5) {
        if (floor2PowerRestored) {
          openElevatorDoors(2);
          setTimeout(() => {
            transitionToNextFloor(3);
          }, 1500);
        } else {
          sub("El ascensor no tiene energía.", 3000);
        }
      }
    } else if (currentBasementFloor === 3) {
      const keypadPos = new THREE.Vector3(zp.x + 1.02, 30.0 + 1.5, zp.z - 53.8);
      if (camera.position.distanceTo(keypadPos) < 3.5) {
        const code = prompt("Escriba la clave de seguridad del ascensor (3 dígitos):");
        if (code === "364") {
          sub("Código correcto. Ascensor desbloqueado.", 4000);
          openElevatorDoors(3);
          setTimeout(() => {
            transitionToNextFloor(4);
          }, 1500);
        } else {
          sub("Código incorrecto.", 3000);
        }
      }
    } else if (currentBasementFloor === 4) {
      const chestPos = new THREE.Vector3(zp.x - 3.4, 45.0 + 0.3, zp.z - 27.5);
      const altarPos = new THREE.Vector3(zp.x + 0.0, 45.0 + 1.0, zp.z - 48.0);
      const elevPos = new THREE.Vector3(zp.x + 1.15, 45.0 + 1.5, zp.z - 54.5);
      
      if (camera.position.distanceTo(chestPos) < 3.5 && !floor4RagdollFound) {
        floor4RagdollFound = true;
        sub("Abres el cofre y encuentras un Muñeco de trapo chamuscado.", 4000);
        try { audio.playGlitch(); } catch(e) {}
      } else if (camera.position.distanceTo(altarPos) < 3.5) {
        if (floor4RagdollFound) {
          if (!floor4AltarBurned) {
            floor4AltarBurned = true;
            sub("Colocas el muñeco en el altar. Se enciende en llamas y los maniquíes se estremecen...", 5000);
            activateAltarFire();
            try { audio.playScream(); } catch(e) {}
          } else {
            sub("El muñeco ya se ha consumido en las llamas.", 2000);
          }
        } else {
          sub("Un altar de piedra con manchas de hollín. Falta una ofrenda.", 3000);
        }
      } else if (camera.position.distanceTo(elevPos) < 3.5) {
        if (floor4AltarBurned) {
          openElevatorDoors(4);
          setTimeout(() => {
            transitionToNextFloor(5);
          }, 1500);
        } else {
          sub("El ascensor no responde. El altar requiere una ofrenda de fuego.", 3000);
        }
      }
    }
  }
}

function transitionToNextFloor(nextFloor) {
  const fadeOverlay = document.getElementById('fade-overlay');
  if (fadeOverlay) {
    fadeOverlay.classList.add('activo');
  }
  
  try {
    audio.playGlitch();
  } catch(e) {}
  
  gameRunning = false;
  
  setTimeout(() => {
    currentBasementFloor = nextFloor;
    const yOffset = (nextFloor - 1) * 15.0;
    const zp = ZONE_POSITIONS[4];
    
    camera.position.set(zp.x, 1.6 + yOffset, zp.z + 20.0);
    camera.lookAt(zp.x, 1.6 + yOffset, zp.z - 10.0);
    
    visitor.visible = true;
    visitorLight.visible = true;
    if (nextFloor === 1) {
      // Floor 1: Lurking at the end of the corridor, static
      visitor.position.set(zp.x, yOffset, zp.z - 35.0);
      visitor.rotation.y = Math.PI; // Looking at the player
    } else if (nextFloor === 2) {
      // Floor 2: Stalking starts, starts further away
      visitor.position.set(zp.x, yOffset, zp.z - 20.0);
    } else if (nextFloor === 3) {
      // Floor 3: Stalking starts closer
      visitor.position.set(zp.x, yOffset, zp.z - 10.0);
    } else if (nextFloor === 4) {
      // Floor 4: Starts very close, just around the corner!
      visitor.position.set(zp.x, yOffset, zp.z + 5.0);
    } else if (nextFloor === 5) {
      // Floor 5: Banish entity, focus on mirror jumpscare
      visitor.visible = false;
      visitorLight.visible = false;
    }
    
    if (nextFloor === 5) {
      jumpscareMirrorTriggered = false;
    }
    
    setTimeout(() => {
      if (fadeOverlay) {
        fadeOverlay.classList.remove('activo');
      }
      gameRunning = true;
      sub(`PISO ${nextFloor}: ${getFloorName(nextFloor)}`, 4000);
    }, 500);
  }, 1000);
}

function getFloorName(floorNum) {
  const names = {
    1: "Almacén de Circo",
    2: "Enfermería de Payasos",
    3: "Celdas de Fieras",
    4: "Pasadizo de Maniquíes",
    5: "Camerino de Espejos Final"
  };
  return names[floorNum] || "";
}

function openElevatorDoors(floorNum) {
  z4.traverse(child => {
    if (child.name === 'Elevator_Floor' + floorNum) {
      child.traverse(subChild => {
        if (subChild.name === 'ElevatorStatusLight') {
          subChild.material.color.setHex(0x00ff00);
        }
      });
      
      let leftDoor, rightDoor;
      child.traverse(subChild => {
        if (subChild.name === 'ElevatorDoorLeft') leftDoor = subChild;
        if (subChild.name === 'ElevatorDoorRight') rightDoor = subChild;
      });
      
      if (leftDoor && rightDoor) {
        let elapsed = 0;
        const interval = setInterval(() => {
          elapsed += 0.05;
          leftDoor.position.x = -0.45 - 0.45 * (elapsed / 1.0);
          rightDoor.position.x = 0.45 + 0.45 * (elapsed / 1.0);
          if (elapsed >= 1.0) {
            clearInterval(interval);
          }
        }, 50);
      }
    }
  });
}

function removePadlockMesh() {
  z4.traverse(child => {
    if (child.name === 'cage_floor2') {
      child.traverse(subChild => {
        if (subChild.name === 'padlock_floor2') {
          subChild.visible = false;
        }
      });
    }
  });
}

function insertFuseMesh() {
  z4.traverse(child => {
    if (child.name === 'fusebox_floor2') {
      const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.1), new THREE.MeshStandardMaterial({
        color: 0x00ff00,
        emissive: 0x00ff00,
        emissiveIntensity: 0.8
      }));
      fuse.rotation.x = Math.PI / 2;
      fuse.position.set(-0.02, 0, 0);
      child.add(fuse);
    }
    if (child.name === 'cage_floor2') {
      child.traverse(subChild => {
        if (subChild.name === 'green_fuse_item') {
          subChild.visible = false;
        }
      });
    }
  });
}

function activateAltarFire() {
  z4.traverse(child => {
    if (child.name === 'altar_floor4') {
      child.traverse(subChild => {
        if (subChild.name === 'altarFireLight') {
          subChild.intensity = 2.0;
        }
      });
      
      const flame = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshStandardMaterial({
        color: 0xff4400,
        emissive: 0xff4400,
        emissiveIntensity: 1.5
      }));
      flame.position.set(0, 1.05, 0);
      child.add(flame);
    }
  });
}

function rotateMannequinHeads() {
  if (zone !== 4 || currentBasementFloor !== 4 || !floor4AltarBurned) return;
  z4.traverse(child => {
    if (child.name === 'VisitorMannequin') {
      const head = child.getPart('neckJoint');
      if (head) {
        const targetWorldPos = camera.position.clone();
        const localTarget = child.worldToLocal(targetWorldPos);
        const angleY = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, Math.atan2(localTarget.x, localTarget.z)));
        head.rotation.y += (angleY - head.rotation.y) * 0.05;
      }
    }
  });
}

// Render Side-by-Side (SBS) Stereoscopic Viewport helper
function renderSBS() {
  const halfWidth = window.innerWidth / 2;
  const height = window.innerHeight;

  const originalPosition = camera.position.clone();
  
  // Clear the screen manually once since autoClear is disabled to allow drawing multi-viewport
  const originalAutoClear = renderer.autoClear;
  renderer.autoClear = false;
  renderer.clear();

  renderer.setScissorTest(true);

  // Left eye
  camera.aspect = halfWidth / height;
  camera.updateProjectionMatrix();
  camera.position.copy(originalPosition);
  camera.translateX(-0.03); // Shift left by 3cm
  renderer.setViewport(0, 0, halfWidth, height);
  renderer.setScissor(0, 0, halfWidth, height);
  composer.render();

  // Right eye
  camera.position.copy(originalPosition);
  camera.translateX(0.06); // Shift right by 6cm (relative from left eye position)
  renderer.setViewport(halfWidth, 0, halfWidth, height);
  renderer.setScissor(halfWidth, 0, halfWidth, height);
  composer.render();

  // Restore
  camera.position.copy(originalPosition);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.autoClear = originalAutoClear;
}

// VR Mode Toggle function
function toggleVR() {
  vrEnabled = !vrEnabled;
  
  if (vrEnabled) {
    // Request iOS Gyroscope permission if available
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') {
            console.log('Gyroscope permission granted');
          }
        })
        .catch(err => console.warn('Gyroscope permission error:', err));
    }
    
    // Unlock Mouse pointer lock
    controls.unlock();
    
    // Hide standard HUD overlays
    document.getElementById('hud').style.display = 'none';
    document.getElementById('miedo').style.display = 'none';
    document.getElementById('zona').style.display = 'none';
    document.getElementById('interact').style.display = 'none';
    
    // Green border / glow style for active VR button
    if (vrBtn) {
      vrBtn.style.borderColor = '#00ff00';
      vrBtn.style.boxShadow = '0 0 10px rgba(0,255,0,0.6)';
    }
    
    sub('Modo VR Activado (Coloca el móvil en tus lentes Cardboard)', 5000);
  } else {
    // Show standard HUD overlays
    document.getElementById('hud').style.display = 'block';
    document.getElementById('miedo').style.display = 'block';
    document.getElementById('zona').style.display = 'block';
    document.getElementById('interact').style.display = 'block';
    
    // Reset VR button styling
    if (vrBtn) {
      vrBtn.style.borderColor = '#8b0000';
      vrBtn.style.boxShadow = '0 0 10px rgba(139,0,0,0.4)';
    }
    
    // Reset renderer viewports
    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    
    sub('Modo VR Desactivado', 3000);
  }
}

document.addEventListener('keydown', e => {
  if (!gameRunning) return;
  
  const key = e.key.toLowerCase();
  if (key === 'e') {
    interact();
    return;
  }
  if (key === 'j') {
    triggerJumpscare();
    return;
  }
  if (key === 'f' || key === 'l' || key === 'tab') {
    e.preventDefault();
    flashOn = !flashOn;
    flashlight.visible = flashOn;
    return;
  }

  switch (e.code) {
    case 'KeyW': keys.w = true; break;
    case 'KeyA': keys.a = true; break;
    case 'KeyS': keys.s = true; break;
    case 'KeyD': keys.d = true; break;
    case 'ShiftLeft': case 'ShiftRight': keys.shift = true; e.preventDefault(); break;
    case 'KeyC': keys.crouch = true; e.preventDefault(); break;
    case 'Space': keys.space = true; e.preventDefault(); break;
  }
});

function triggerJumpscare() {
  const nowTime = Date.now();

  const overlay = document.getElementById('jumpscare-overlay');
  if (!overlay) return;

  fearEngine.setLookAngle(0);
  try { audio.playScream(); } catch (e) {}
  overlay.classList.add('activo');

  let glitchCount = 0;
  const glitchInterval = setInterval(() => {
    triggerGlitch();
    glitchCount++;
    if (glitchCount > 8) clearInterval(glitchInterval);
  }, 60);

  setTimeout(() => {
    overlay.classList.remove('activo');
  }, 800);
}

function triggerClimax() {
  sub('TODO SE DISTORSIONA', 5000);
  let elapsed = 0;
  const si = setInterval(() => {
    elapsed += 0.05;
    const intensity = Math.max(0, 1 - elapsed / 6) * 0.15;
    camera.position.x += (Math.random() - 0.5) * intensity;
    camera.position.z += (Math.random() - 0.5) * intensity;
    if (elapsed > 6) {
      clearInterval(si);
      endGame();
    }
  }, 50);
}
