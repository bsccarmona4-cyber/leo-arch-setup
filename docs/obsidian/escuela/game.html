//  INTERACT PROXIMITY CHECK (cada frame)
// ═══════════════════════════════════════════════════════════════
function checkInteractProximity() {
  const zp = ZONE_POSITIONS[zone];
  let doorPos = null;
  let promptText = '[E] Interactuar';
  
  if (zone === 1) {
    doorPos = door1Pos;
    promptText = '[E] Entrar al pasillo';
  } else if (zone === 2) {
    const d2 = (door2 && door2.userData.isOpen) ? 9999 : camera.position.distanceTo(door2Pos);
    const d3 = (door3 && door3.userData.isOpen) ? 9999 : camera.position.distanceTo(door3Pos);
    if (d2 < d3) {
      if (d2 < 5) {
        doorPos = door2Pos;
        promptText = '[E] Abrir puerta';
      }
    } else {
      if (d3 < 5) {
        doorPos = door3Pos;
        promptText = '[E] Abrir puerta';
      }
    }
  } else if (zone === 3) {
    doorPos = door4Pos;
    if (door4 && (door4.userData.isOpen || door4.userData.isOpening)) {
      promptText = '[E] Entrar al sótano';
    } else {
      promptText = '[E] Abrir puerta';
    }
  } else if (zone === 4) {
    if (currentBasementFloor === 1) {
      const deskPos = new THREE.Vector3(zp.x - 3.5, 0.375, zp.z + 12);
      const elevPos = new THREE.Vector3(zp.x + 1.15, 1.5, zp.z - 54.5);
      
      if (camera.position.distanceTo(deskPos) < 3.5) {
        doorPos = deskPos;
        promptText = '[E] Abrir cajón cerrado';
      } else if (camera.position.distanceTo(elevPos) < 3.5) {
        doorPos = elevPos;
        promptText = '[E] Llamar ascensor';
      }
    } else if (currentBasementFloor === 2) {
      const padlockPos = new THREE.Vector3(zp.x + 2.6, 15.0 + 0.7, zp.z - 16.4);
      const fusePos = new THREE.Vector3(zp.x + 1.15, 15.0 + 1.6, zp.z - 38.0);
      const elevPos = new THREE.Vector3(zp.x + 1.15, 15.0 + 1.5, zp.z - 54.5);
      
      if (camera.position.distanceTo(padlockPos) < 3.5 && !hasFloor2Fuse) {
        doorPos = padlockPos;
        promptText = '[E] Introducir código del candado';
      } else if (camera.position.distanceTo(fusePos) < 3.5 && !floor2PowerRestored) {
        doorPos = fusePos;
        promptText = '[E] Colocar fusible';
      } else if (camera.position.distanceTo(elevPos) < 3.5) {
        doorPos = elevPos;
        promptText = '[E] Llamar ascensor';
      }
    } else if (currentBasementFloor === 3) {
      const keypadPos = new THREE.Vector3(zp.x + 1.02, 30.0 + 1.5, zp.z - 53.8);
      if (camera.position.distanceTo(keypadPos) < 3.5) {
        doorPos = keypadPos;
        promptText = '[E] Introducir código del teclado';
      }
    } else if (currentBasementFloor === 4) {
      const chestPos = new THREE.Vector3(zp.x - 3.4, 45.0 + 0.3, zp.z - 27.5);
      const altarPos = new THREE.Vector3(zp.x + 0.0, 45.0 + 1.0, zp.z - 48.0);
      const elevPos = new THREE.Vector3(zp.x + 1.15, 45.0 + 1.5, zp.z - 54.5);
      
      if (camera.position.distanceTo(chestPos) < 3.5 && !floor4RagdollFound) {
        doorPos = chestPos;
        promptText = '[E] Abrir cofre mediano';
      } else if (camera.position.distanceTo(altarPos) < 3.5) {
        doorPos = altarPos;
        promptText = floor4AltarBurned ? '[E] Examinar altar' : '[E] Quemar ofrenda en el altar';
      } else if (camera.position.distanceTo(elevPos) < 3.5) {
        doorPos = elevPos;
        promptText = '[E] Llamar ascensor';
      }
    }
  }
  
  if (doorPos && camera.position.distanceTo(doorPos) < 5) {
    interactEl.textContent = promptText;
    interactEl.classList.add('mostrar');
  } else {
    interactEl.classList.remove('mostrar');
  }
}

// ═══════════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Apply gyroscope orientation in VR mode
  if (vrEnabled && hasGyro) {
    const alpha = gyroOrientation.alpha ? THREE.MathUtils.degToRad(gyroOrientation.alpha) : 0;
    const beta = gyroOrientation.beta ? THREE.MathUtils.degToRad(gyroOrientation.beta) : 0;
    const gamma = gyroOrientation.gamma ? THREE.MathUtils.degToRad(gyroOrientation.gamma) : 0;
    const orient = screenOrientation ? THREE.MathUtils.degToRad(screenOrientation) : 0;

    const deviceQuaternion = new THREE.Quaternion();
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90 deg X axis

    euler.set(beta, alpha, -gamma, 'YXZ');
    deviceQuaternion.setFromEuler(euler);

    q0.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient);
    deviceQuaternion.multiply(q0);
    deviceQuaternion.multiply(q1);

    camera.quaternion.copy(deviceQuaternion);
  }

  if (!gameRunning) {
    if (vrEnabled) {
      renderSBS();
    } else {
      composer.render();
    }
    return;
  }

  gameTime += dt;
  const fearLevel = fearEngine.getFear();

  // Animación de apertura de la puerta 2 (bisagra Y-rotation)
  if (door2 && door2.userData.isOpening) {
    const pivot = door2.userData.doorPivot;
    if (pivot) {
      const targetRot = -Math.PI / 1.8; // ~100 grados hacia adentro
      pivot.rotation.y += (targetRot - pivot.rotation.y) * 0.03;
      if (Math.abs(pivot.rotation.y - targetRot) < 0.01) {
        pivot.rotation.y = targetRot;
        door2.userData.isOpening = false;
        door2.userData.isOpen = true;
      }
    }
  }
  // Animación de apertura de la puerta 3 (bisagra Y-rotation)
  if (door3 && door3.userData.isOpening) {
    const pivot = door3.userData.doorPivot;
    if (pivot) {
      const targetRot = -Math.PI / 1.8;
      pivot.rotation.y += (targetRot - pivot.rotation.y) * 0.03;
      if (Math.abs(pivot.rotation.y - targetRot) < 0.01) {
        pivot.rotation.y = targetRot;
        door3.userData.isOpening = false;
        door3.userData.isOpen = true;
      }
    }
  }
  // Animación de apertura de la puerta 4 (bisagra Y-rotation)
  if (door4 && door4.userData.isOpening) {
    const pivot = door4.userData.doorPivot;
    if (pivot) {
      const targetRot = -Math.PI / 1.8;
      pivot.rotation.y += (targetRot - pivot.rotation.y) * 0.03;
      if (Math.abs(pivot.rotation.y - targetRot) < 0.01) {
        pivot.rotation.y = targetRot;
        door4.userData.isOpening = false;
        door4.userData.isOpen = true;
      }
    }
  }

  // Animación de luces de Zona 4 (parpadeo y columpio)
  if (zone === 4 && z4.userData.flickeringLights) {
    // 1. Columpiar los grupos de bombillas (pivotes)
    if (z4.userData.swingingGroups) {
      z4.userData.swingingGroups.forEach((group, idx) => {
        const speed = 1.4 + idx * 0.15;
        const angle = 0.06 + idx * 0.015;
        group.rotation.z = Math.sin(gameTime * speed) * angle;
        group.rotation.x = Math.cos(gameTime * (speed * 0.9)) * (angle * 0.4);
      });
    }

    // 2. Parpadeo caótico de luz
    z4.userData.flickeringLights.forEach((light, idx) => {
      const baseIntensity = idx < 4 ? 0.8 : 1.2;
      if (idx === 4) {
        // Reflector rojo final
        if (Math.random() < 0.04) {
          light.intensity = Math.random() < 0.2 ? 0.0 : Math.random() * 0.4;
        } else {
          light.intensity += (baseIntensity - light.intensity) * 0.08;
        }
      } else {
        // Bombillas de pasillo
        if (Math.random() < 0.07) {
          light.intensity = Math.random() < 0.3 ? 0.03 : Math.random() * 0.25;
        } else {
          light.intensity += (baseIntensity - light.intensity) * 0.12;
        }
      }
    });
  }

  // ── MOVEMENT ──
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  const right = forward.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2);

  let spd = 4;
  if (keys.shift) {
    spd = 7; // Correr (Sprint)
  } else if (keys.crouch) {
    spd = 2; // Agacharse (Crouch)
  }
  const move = new THREE.Vector3();
  if (keys.w) move.add(forward);
  if (keys.s) move.sub(forward);
  if (keys.d) move.add(right);
  if (keys.a) move.sub(right);

  // Poll Gamepad for movement, looking around, and button inputs
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (let i = 0; i < gamepads.length; i++) {
    if (gamepads[i]) { gp = gamepads[i]; break; }
  }
  if (gp) {
    const moveX = gp.axes[0];
    const moveY = gp.axes[1];
    const deadzone = 0.15;
    if (Math.abs(moveY) > deadzone) {
      move.addScaledVector(forward, -moveY);
    }
    if (Math.abs(moveX) > deadzone) {
      move.addScaledVector(right, moveX);
    }

    // Gamepad right stick for looking around (yaw and pitch)
    const lookX = gp.axes[2];
    const lookY = gp.axes[3];
    if (!vrEnabled && (Math.abs(lookX) > deadzone || Math.abs(lookY) > deadzone)) {
      const rx = Math.abs(lookX) > deadzone ? lookX : 0;
      const ry = Math.abs(lookY) > deadzone ? lookY : 0;
      const sensitivity = 2.0;
      camera.rotation.y -= rx * sensitivity * dt;
      camera.rotation.x -= ry * sensitivity * dt;
      const maxLook = Math.PI / 2 - 0.05;
      camera.rotation.x = Math.max(-maxLook, Math.min(maxLook, camera.rotation.x));
    }

    // Gamepad buttons mapping
    // Button 0 (A): Jump
    const btnJump = gp.buttons[0].pressed;
    if (btnJump && !gpLastJump) {
      if (isGrounded) {
        yVelocity = JUMP_FORCE;
        isGrounded = false;
      }
    }
    gpLastJump = btnJump;

    // Button 1 (B) or Button 10 (Left stick click): Crouch toggle
    const btnCrouch = gp.buttons[1].pressed || (gp.buttons[10] && gp.buttons[10].pressed);
    if (btnCrouch && !gpLastCrouch) {
      keys.crouch = !keys.crouch;
    }
    gpLastCrouch = btnCrouch;

    // Button 2 (X) or Button 5 (Right bumper): Interact
    const btnInteract = gp.buttons[2].pressed || (gp.buttons[5] && gp.buttons[5].pressed);
    if (btnInteract && !gpLastInteract) {
      interact();
    }
    gpLastInteract = btnInteract;

    // Button 3 (Y) or Button 4 (Left bumper): Flashlight toggle
    const btnFlash = gp.buttons[3].pressed || (gp.buttons[4] && gp.buttons[4].pressed);
    if (btnFlash && !gpLastFlash) {
      flashOn = !flashOn;
      flashlight.visible = flashOn;
    }
    gpLastFlash = btnFlash;
  }

  const isMoving = move.lengthSq() > 0.001;
  const prevX = camera.position.x;
  const prevZ = camera.position.z;
  if (isMoving) {
    if (move.lengthSq() > 1) move.normalize();
    move.multiplyScalar(spd * dt);
    camera.position.x += move.x;
    camera.position.z += move.z;
    if (Math.random() < dt * 5) {
      audio.playStep(zone === 1 ? 'sand' : (zone === 3 ? 'carpet' : 'wood'));
    }
  }

  // Gravity & jump
  if (keys.space && isGrounded) {
    yVelocity = JUMP_FORCE;
    isGrounded = false;
  }
  const zp = ZONE_POSITIONS[zone];
  // ── WALKABLE HILLS & HEIGHT SYSTEM ──
  let floorY = 0.0;
  if (zone === 3) {
    const localX = camera.position.x - zp.x;
    const localZ = camera.position.z - zp.z;
    const hillConfigs = [
      { x: -30, z: -25, rx: 12, rz: 14, h: 3.5 },
      { x: 25, z: -35, rx: 18, rz: 15, h: 4.0 },
      { x: -15, z: 20, rx: 10, rz: 12, h: 2.5 },
      { x: 35, z: 15, rx: 16, rz: 13, h: 3.0 },
      { x: -40, z: -45, rx: 14, rz: 11, h: 3.2 },
      { x: 10, z: -50, rx: 20, rz: 16, h: 4.5 },
      { x: -20, z: -40, rx: 8, rz: 9, h: 2.0 },
    ];
    hillConfigs.forEach(cfg => {
      const dx = localX - cfg.x;
      const dz = localZ - cfg.z;
      const val = (dx * dx) / (cfg.rx * cfg.rx) + (dz * dz) / (cfg.rz * cfg.rz);
      if (val < 1.0) {
        const hy = cfg.h * Math.sqrt(1.0 - val);
        if (hy > floorY) {
          floorY = hy;
        }
      }
    });
  } else if (zone === 4) {
    floorY = (currentBasementFloor - 1) * 15.0;
  }

  const eyeHeight = floorY + (keys.crouch ? 0.9 : 1.6);
  if (!isGrounded) {
    yVelocity -= GRAVITY * dt;
    camera.position.y += yVelocity * dt;
    if (camera.position.y <= eyeHeight) {
      camera.position.y = eyeHeight;
      yVelocity = 0;
      isGrounded = true;
    }
  } else {
    if (camera.position.y - eyeHeight > 0.5) {
      isGrounded = false;
      yVelocity = 0;
    } else {
      camera.position.y += (eyeHeight - camera.position.y) * 0.25;
    }
  }

  // Bounds per zone
  if (zone === 1) {
    const dist = Math.hypot(camera.position.x - zp.x, camera.position.z - zp.z);
    if (dist > 13.5) {
      const angle = Math.atan2(camera.position.z - zp.z, camera.position.x - zp.x);
      camera.position.x = zp.x + Math.cos(angle) * 13.5;
      camera.position.z = zp.z + Math.sin(angle) * 13.5;
    }
  } else if (zone === 2) {
    // Pasillo principal + Rama del corredor hacia door3 con colisiones
    const isDoor2Open = true; // Empieza abierta (acceso desde el circo)
    const isDoor3Open = door3 && door3.userData.isOpen;
    const localX = camera.position.x - zp.x;
    const localZ = camera.position.z - zp.z;

    if (localZ < -1.5) {
      // El jugador está dentro del pasillo lateral (rama) hacia door3
      if (!jumpscareCorridorTriggered) {
        jumpscareCorridorTriggered = true;
        triggerJumpscare();
      }
      camera.position.x = Math.max(zp.x - 0.9, Math.min(zp.x + 0.9, camera.position.x));
      const minZ = isDoor3Open ? -15.0 : -12.2;
      camera.position.z = Math.max(zp.z + minZ, Math.min(zp.z - 1.5, camera.position.z));
      
      // Si pasa de localZ = -12.8 (cruza la puerta 3 abierta), detonar transición a Zona 3
      if (localZ < -12.8) {
        changeZone(3);
        sub('La realidad se distorsiona...', 4000);
      }
    } else {
      // El jugador está en el pasillo principal
      const maxX = 27.6; // Borde derecho del pasillo principal
      camera.position.x = Math.max(zp.x - 29.0, Math.min(zp.x + maxX, camera.position.x));

      // Si está alineado con la rama, puede entrar en ella
      if (Math.abs(localX) < 0.9) {
        const minZ = isDoor3Open ? -15.0 : -12.2;
        camera.position.z = Math.max(zp.z + minZ, Math.min(zp.z + 1.5, camera.position.z));
      } else {
        camera.position.z = Math.max(zp.z - 1.5, Math.min(zp.z + 1.5, camera.position.z));
      }
    }
  } else if (zone === 3) {
    // Exterior Falso: limite de cuarto gigante (120x120m centrado en zp.x, 0, zp.z)
    const limX = 59; // 120/2 - 1m margen
    const limZ = 59;
    camera.position.x = Math.max(zp.x - limX, Math.min(zp.x + limX, camera.position.x));
    camera.position.z = Math.max(zp.z - limZ, Math.min(zp.z + limZ, camera.position.z));

    // Jumpscare al acercarse a las casas por primera vez
    if (!jumpscareHousesTriggered && z3.userData.housePositions) {
      for (const hp of z3.userData.housePositions) {
        const hx = hp.x + z3.position.x;
        const hz = hp.z + z3.position.z;
        const distToHouse = camera.position.distanceTo(new THREE.Vector3(hx, camera.position.y, hz));
        if (distToHouse < 8.0) {
          jumpscareHousesTriggered = true;
          triggerJumpscare();
          break;
        }
      }
    }

    // Colisión contra las casas de juguete
    if (z3.userData.housePositions) {
      z3.userData.housePositions.forEach((hp, idx) => {
        // Si es la Casa 1 (azul, index 1) y door4 está abierta, no colisionar si cruzamos por ella
        if (idx === 1 && door4 && door4.userData.isOpen) {
          const distToDoor = camera.position.distanceTo(door4Pos);
          if (distToDoor < 2.0) {
            return; // Omitir colisión para pasar
          }
        }

        const hx = hp.x + z3.position.x;
        const hz = hp.z + z3.position.z;
        const cos = Math.cos(-hp.rot);
        const sin = Math.sin(-hp.rot);
        const localX = (camera.position.x - hx) * cos - (camera.position.z - hz) * sin;
        const localZ = (camera.position.x - hx) * sin + (camera.position.z - hz) * cos;
        const halfHouse = 2.8; // 5/2 + 0.3m margen
        if (Math.abs(localX) < halfHouse && Math.abs(localZ) < halfHouse) {
          camera.position.x = prevX;
          camera.position.z = prevZ;
        }
      });
    }

    // Transición a la Zona 4 si la puerta de la casa azul está abierta
    if (door4 && door4.userData.isOpen) {
      const distToDoor4 = camera.position.distanceTo(door4Pos);
      if (distToDoor4 < 1.2) {
        changeZone(4);
      }
    }
  } else if (zone === 4) {
    // Zona 4: Camerinos del Circo Subterráneos (Coordenadas locales restringidas)
    const localX = camera.position.x - zp.x;
    const localZ = camera.position.z - zp.z;

    let inBounds = false;

    // A. Pasillo principal (x de -1.2 a 1.2, z de -40 a 25)
    if (localX >= -1.2 && localX <= 1.2 && localZ >= -40 && localZ <= 25) {
      inBounds = true;
    }
    // B. Camerino 1 (izq) (x de -4.0 a -1.2, z de 10 a 14)
    else if (localX >= -4.0 && localX <= -1.2 && localZ >= 10 && localZ <= 14) {
      inBounds = true;
    }
    // C. Camerino 2 (der) (x de 1.2 a 4.0, z de -19 a -15)
    else if (localX >= 1.2 && localX <= 4.0 && localZ >= -19 && localZ <= -15) {
      inBounds = true;
    }
    // D. Almacén 3 (izq) (x de -5.0 a -1.2, z de -30 a -25)
    else if (localX >= -5.0 && localX <= -1.2 && localZ >= -30 && localZ <= -25) {
      inBounds = true;
    }
    // E. Habitación del espejo final (x de -3.0 a 3.0, z de -55 a -40)
    else if (localX >= -3.0 && localX <= 3.0 && localZ >= -55 && localZ <= -40) {
      inBounds = true;
    }

    if (!inBounds) {
      camera.position.x = prevX;
      camera.position.z = prevZ;
    }

    // Túnel de agacharse obligado: localZ entre -8 y 0.
    // Si el jugador está dentro de este rango en Z y no está agachado (keys.crouch es falso),
    // bloqueamos el avance hacia adelante (decreciendo en Z).
    if (localZ <= 0 && localZ >= -8 && Math.abs(localX) <= 1.2) {
      if (!keys.crouch) {
        if (localZ < prevZ - zp.z || camera.position.y > 1.25) {
          camera.position.z = prevZ;
          camera.position.x = prevX;
        }
      }
    }

    // Mannequin heads look direction (Piso 4)
    if (currentBasementFloor === 4) {
      rotateMannequinHeads();
    }

    // Proximidad al espejo final localPos (0, 1.6, -54.8) -> worldPos (zp.x, 60.0 + 1.6, zp.z - 54.8)
    if (currentBasementFloor === 5) {
      const mirrorWorldPos = new THREE.Vector3(zp.x, 60.0 + 1.6, zp.z - 54.8);
      const distToMirror = camera.position.distanceTo(mirrorWorldPos);

      // Jumpscare al ver por primera vez el espejo
      if (!jumpscareMirrorTriggered && distToMirror < 12.0) {
        const dirToMirror = mirrorWorldPos.clone().sub(camera.position).normalize();
        const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
        const dotMirror = camDir.dot(dirToMirror);
        if (dotMirror > 0.85) {
          jumpscareMirrorTriggered = true;
          triggerJumpscare();
        }
      }

      if (distToMirror < 1.8) {
        triggerClimax();
      }
    }
  }

  // ── FEAR ENGINE — FIX #6: usar como fuente única ──
  fearEngine.setMoving(isMoving);
  fearEngine.setInDarkZone(!flashOn);

  // Near light check
  let nearLight = false;
  if (zone === 3) {
    nearLight = true;
  } else {
    const currentLights = zone === 1 ? z1Lights : zone === 2 ? z2Lights : [];
    const zoneOffset = ZONE_POSITIONS[zone];
    for (const l of currentLights) {
      const worldPos = l.position.clone().add(zoneOffset);
      if (camera.position.distanceTo(worldPos) < 5) { nearLight = true; break; }
    }
  }
  fearEngine.setNearLight(nearLight);

  // Hiding indicator and mechanics in Zone 4 (basement)
  let isPlayerHidden = false;
  if (zone === 4) {
    const localX = camera.position.x - zp.x;
    const localZ = camera.position.z - zp.z;
    const inCamerino1 = (localX >= -4.0 && localX <= -1.2 && localZ >= 10 && localZ <= 14);
    const inCamerino2 = (localX >= 1.2 && localX <= 4.0 && localZ >= -19 && localZ <= -15);
    const inAlmacen3 = (localX >= -5.0 && localX <= -1.2 && localZ >= -30 && localZ <= -25);
    
    if (inCamerino1 || inCamerino2 || inAlmacen3) {
      isPlayerHidden = true;
    }
  }

  if (zone === 4 && isPlayerHidden) {
    // Decay fear level quickly when hiding in shadows
    const currentFear = fearEngine.getFear();
    fearEngine.setFear(Math.max(0, currentFear - 0.25 * dt));
    
    // Display hiding indicator in subtitles
    subtitulosEl.textContent = '* Escondido en las sombras (La entidad pierde tu rastro) *';
    subtitulosEl.classList.add('mostrar');
    if (subTimer) { clearTimeout(subTimer); subTimer = null; }
  } else {
    if (subtitulosEl.textContent.includes('* Escondido')) {
      subtitulosEl.classList.remove('mostrar');
      subtitulosEl.textContent = '';
    }
  }

  // Difficulty scaling of the entity based on the floor
  if (zone === 4) {
    if (currentBasementFloor === 1) {
      visitorAI._state = 'DORMANT';
      visitorAI._orbitRadius = 100.0;
      visitorAI._speedMult = 0.0;
    } else if (currentBasementFloor === 2) {
      visitorAI._orbitRadius = 7.0;
      visitorAI._speedMult = 1.0;
    } else if (currentBasementFloor === 3) {
      visitorAI._orbitRadius = 4.5;
      visitorAI._speedMult = 1.35;
    } else if (currentBasementFloor === 4) {
      visitorAI._orbitRadius = 2.8;
      visitorAI._speedMult = 1.65;
    }
  } else {
    visitorAI._orbitRadius = 4.0;
    visitorAI._speedMult = 1.12;
  }

  const shouldUpdateVisitor = !(zone === 4 && currentBasementFloor === 4 && floor4AltarBurned) && (currentBasementFloor !== 5 || zone !== 4);

  let isLookingAtVisitor = false;
  let distToVisitor = 999;

  // Monster look angle
  if (shouldUpdateVisitor) {
    const dirToVisitor = visitor.position.clone().sub(camera.position).normalize();
    const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
    const dot = camDir.dot(dirToVisitor);
    const angle = Math.acos(THREE.MathUtils.clamp(dot, -1, 1));
    distToVisitor = camera.position.distanceTo(visitor.position);
    if (distToVisitor < 15) {
      fearEngine.setLookAngle(angle);
      if (dot > 0.82) {
        isLookingAtVisitor = true;
      }
    } else {
      fearEngine.setLookAngle(null);
    }
  } else {
    fearEngine.setLookAngle(null);
  }

  fearEngine.update(dt);
  const miedo = fearEngine.getFear();

  // ── VISITOR AI ──
  if (shouldUpdateVisitor) {
    visitorAI.update(dt, (zone === 4 && isPlayerHidden) ? 0.0 : miedo, camera.position);
    visitorLight.position.copy(visitor.position);
    visitorLight.position.y += 1.6;
    visitorLight.intensity = 1 + miedo * 3;
    visitor.visible = true;
    visitorLight.visible = true;

    // Actualizar posición sonora 3D del Ente y del Listener
    if (audio.ready) {
      audio.updateListener(camera);
      audio.updateEntityPosition(visitor.position);
    }
  } else {
    visitor.visible = false;
    visitorLight.visible = false;

    // Apagar zumbido del Ente si no está activo
    if (audio.ready && audio.entityGain) {
      audio.entityGain.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.15);
    }
  }

  // Materialization
  updateMaterialization(miedo);

  // ── AUDIO FEAR ──
  audio.setFear(miedo);
  if (audio.ready) {
    audio.updateAcoustics(zone);
  }

  // ── UI UPDATES ──
  if (miedoFill) miedoFill.style.height = (miedo * 100) + '%';

  // ── PANIC VIGNETTE ANIMATION ──
  const panicVignette = document.getElementById('panic-vignette');
  if (panicVignette) {
    if (miedo > 0.2) {
      const fearFactor = (miedo - 0.2) / 0.8;
      const bpm = 60 + fearFactor * 80;
      const pulseSpeed = (bpm / 60) * Math.PI * 2;
      
      const tPulse = gameTime * pulseSpeed;
      let heartWave = Math.sin(tPulse) + 0.4 * Math.sin(2 * tPulse - 1.2);
      heartWave = Math.max(0.0, heartWave);
      
      const pulseOpacity = fearFactor * 0.4 + heartWave * fearFactor * 0.5;
      
      const innerRadius = Math.max(10, 45 - fearFactor * 25 - heartWave * fearFactor * 15);
      const midRadius = Math.max(40, 75 - fearFactor * 30 - heartWave * fearFactor * 15);
      
      panicVignette.style.opacity = Math.min(0.95, pulseOpacity);
      panicVignette.style.background = `radial-gradient(circle, transparent ${innerRadius}%, rgba(139, 0, 0, 0.55) ${midRadius}%, rgba(15, 0, 0, 0.98) 100%)`;
    } else {
      panicVignette.style.opacity = 0;
    }
  }

  // ── PARANOIA SHADOWS ──
  const playerFloorY = camera.position.y - (keys.crouch ? 0.9 : 1.6);
  if (!paranoiaActive) {
    if (miedo > 0.5 && (zone === 2 || zone === 4)) {
      paranoiaCooldown -= dt;
      if (paranoiaCooldown <= 0) {
        paranoiaCooldown = 20 + Math.random() * 10;
        
        // Spawn the shadow 8-12m away, 35-50 degrees off-axis
        const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        camDir.y = 0;
        camDir.normalize();
        
        const dist = 8 + Math.random() * 4;
        const angleOffset = (35 + Math.random() * 15) * (Math.PI / 180) * (Math.random() < 0.5 ? -1 : 1);
        
        const spawnDir = camDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angleOffset);
        const spawnPos = camera.position.clone().add(spawnDir.multiplyScalar(dist));
        
        shadowMesh.position.set(spawnPos.x, playerFloorY + 0.7, spawnPos.z);
        shadowMat.opacity = 0.0;
        paranoiaActive = true;
        paranoiaTimer = 0;
        paranoiaFadeState = 'fadeIn';
      }
    }
  } else {
    paranoiaTimer += dt;
    shadowMesh.position.y = playerFloorY + 0.7;
    
    // Calculate angle to player's look direction
    const dirToShadow = shadowMesh.position.clone().sub(camera.position).normalize();
    const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
    const dot = camDir.dot(dirToShadow);
    const angle = Math.acos(THREE.MathUtils.clamp(dot, -1, 1));
    const angleDeg = THREE.MathUtils.radToDeg(angle);
    
    // Looked at directly (less than 15 degrees)
    if (angleDeg < 15.0 && paranoiaFadeState !== 'fadeOut') {
      paranoiaFadeState = 'fadeOut';
    }
    
    // Timeout check (5 seconds duration)
    if (paranoiaTimer >= 5.0 && paranoiaFadeState !== 'fadeOut') {
      paranoiaFadeState = 'fadeOut';
    }
    
    // Update opacity based on fade state
    if (paranoiaFadeState === 'fadeIn') {
      shadowMat.opacity += dt / 1.0; // fade in over 1 second
      if (shadowMat.opacity >= 0.15) {
        shadowMat.opacity = 0.15;
        paranoiaFadeState = 'idle';
      }
    } else if (paranoiaFadeState === 'fadeOut') {
      shadowMat.opacity -= dt / 0.2; // fade out over 0.2 seconds
      if (shadowMat.opacity <= 0.0) {
        shadowMat.opacity = 0.0;
        paranoiaActive = false;
        paranoiaFadeState = 'idle';
        shadowMesh.position.set(0, -999, 0); // Hide again
      }
    }
  }

  // ── ADRENALINE FOV DILATION ──
  if (miedo > 0.3) {
    const fearFactor = (miedo - 0.2) / 0.8;
    const bpm = 60 + Math.max(0, fearFactor) * 80;
    const pulseSpeed = (bpm / 60) * Math.PI * 2;
    const targetFov = 70 + (miedo * 4.5) + Math.sin(gameTime * pulseSpeed) * miedo * 1.5;
    camera.fov += (targetFov - camera.fov) * 5.0 * dt;
    camera.updateProjectionMatrix();
  } else if (Math.abs(camera.fov - 70) > 0.05) {
    camera.fov += (70 - camera.fov) * 5.0 * dt;
    camera.updateProjectionMatrix();
  } else if (camera.fov !== 70) {
    camera.fov = 70;
    camera.updateProjectionMatrix();
  }

  // ── Z1 LIGHT FLICKER ──
  const t = gameTime;
  z1Lights.forEach((light) => {
    const flicker = Math.sin(t * light.flickerFreq * 6) * 0.3;
    const rand = Math.random();
    if (rand > 0.985) {
      light.intensity = 0.05;
    } else if (rand > 0.96) {
      light.intensity = 0.3 + Math.sin(t * light.flickerFreq * 40) * 0.3;
    } else {
      light.intensity = 0.7 + flicker * 0.1;
    }
  });

  // ── PUERTAS FLICKER ──
  [door1, door2, door3, door4].forEach(d => {
    if (!d || !d.userData.flickerPhase) return;
    const f = d.userData;
    // Parpadeo constante cada frame: seno + ruido
    const wave = Math.sin(t * f.flickerSpeed * 10 + f.flickerPhase) * 0.15;
    const noise = (Math.random() * 2 - 1) * 0.15;
    const flickerFactor = 0.7 + wave + noise;
    d.children.forEach(c => {
      if (c.isSpotLight) c.intensity = 8.0 * Math.max(0.2, flickerFactor);
    });
    // Estela 3D parpadea
    if (d.userData.beamMesh) {
      d.userData.beamMesh.material.opacity = (0.2 + 0.6 * Math.max(0.2, flickerFactor)) * 0.95;
    }
    // Bombilla física parpadea en su color emissive
    if (d.userData.bulbMesh) {
      d.userData.bulbMesh.material.emissiveIntensity = 5.0 * Math.max(0.2, flickerFactor);
    }
  });

  // ── Z3 CLOCK AND BENCH ANIMATION ──
  if (zone === 3 && z3) {
    if (z3.userData.clockHourHand && z3.userData.clockMinuteHand) {
      z3.userData.clockMinuteHand.rotation.z = t * 0.5;
      z3.userData.clockHourHand.rotation.z = t * 0.04;
    }
    if (z3.userData.floatingBench) {
      z3.userData.floatingBench.position.y = 0.35 + Math.sin(t * 0.8) * 0.06;
      z3.userData.floatingBench.rotation.z = Math.sin(t * 0.5) * 0.02;
    }
  }

  // ── VHS POST-PROCESSING ──
  renderVHSGrain(miedo);
  
  let fearVisual = miedo;
  if (isLookingAtVisitor && distToVisitor < 12) {
    const proximityFactor = (12 - distToVisitor) / 12;
    fearVisual = Math.min(1.0, miedo + proximityFactor * 0.4);
    
    // Pequeños estallidos de estática al sensor por cercanía y mirada directa
    if (Math.random() > 0.95 - proximityFactor * 0.1) {
      vhsPass.uniforms.glitch.value = proximityFactor * 0.5 * Math.random();
    } else {
      vhsPass.uniforms.glitch.value = 0.0;
    }
  } else {
    if (vhsPass.uniforms.glitch.value > 0.0 && !glitchEl.classList.contains('activo')) {
      vhsPass.uniforms.glitch.value = 0.0;
    }
  }
  
  vhsPass.uniforms.fear.value = fearVisual;
  vhsPass.uniforms.uTime.value = gameTime;
  bloom.strength = 0.15 + fearVisual * 0.35; // FIX #14: capped at 0.5

  // Glitch scheduling
  glitchAccum += dt * 1000;
  if (glitchAccum > nextGlitchAt) {
    nextGlitchAt = 20000 + Math.random() * 40000;
    glitchAccum = 0;
    triggerGlitch();
    if (miedo > 0.5 && Math.random() < 0.5) triggerGlitch();
  }

  // ── FLASHLIGHT — FIX #12: sigue a la cámara y parpadea con el miedo ──
  if (flashOn) {
    flashlight.position.copy(camera.position);
    const targetDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    flashlight.target.position.copy(camera.position).add(targetDir);
    
    let targetIntensity = 2.5;
    if (miedo > 0.35) {
      const fearFactor = (miedo - 0.35) / 0.65;
      let jitter = 1.0;
      if (Math.random() > 0.85 - fearFactor * 0.3) {
        jitter = 0.3 + 0.7 * Math.random();
      }
      if (fearFactor > 0.6 && Math.random() > 0.985) {
        jitter = 0.0;
        if (Math.random() > 0.7 && audio.ready) {
          audio.playGlitch();
        }
      }
      targetIntensity = 2.5 * jitter;
    }
    flashlight.intensity = targetIntensity;
  }

  // ── PARTICLES — FIX #4: needsUpdate ──
  particles.rotation.y += dt * 0.02;
  particles.position.copy(camera.position);
  particles.position.y = 2;
  const ppos = particles.geometry.attributes.position.array;
  for (let i = 0; i < ppos.length; i += 3) {
    ppos[i + 1] += Math.sin(gameTime + ppos[i]) * dt * 0.02;
  }
  particles.geometry.attributes.position.needsUpdate = true; // FIX #4

  // ── COLD BREATH VAPOR UPDATE ──
  breathTimer += dt;
  const breathInterval = 3.5 - miedo * 1.5;
  if (breathTimer > breathInterval) {
    breathTimer = 0;
    if (zone === 4) {
      triggerColdBreath();
    }
  }

  const bPosAttr = breathPoints.geometry.attributes.position;
  const bColorAttr = breathPoints.geometry.attributes.color;
  let activeBreathCount = 0;

  for (let i = 0; i < maxBreathParticles; i++) {
    if (breathLifes[i] > 0) {
      breathLifes[i] -= dt;
      if (breathLifes[i] <= 0) {
        bPosAttr.setY(i, -9999);
        bColorAttr.setXYZ(i, 0, 0, 0);
      } else {
        const px = bPosAttr.getX(i) + breathVels[i].x * dt;
        const py = bPosAttr.getY(i) + breathVels[i].y * dt;
        const pz = bPosAttr.getZ(i) + breathVels[i].z * dt;
        bPosAttr.setXYZ(i, px, py, pz);
        
        breathVels[i].multiplyScalar(0.96);
        
        const lifeFactor = breathLifes[i] / 1.8;
        const c = lifeFactor * 0.18;
        bColorAttr.setXYZ(i, c, c, c);
        activeBreathCount++;
      }
    }
  }

  if (activeBreathCount > 0) {
    bPosAttr.needsUpdate = true;
    bColorAttr.needsUpdate = true;
  }

  // ── INTERACT PROXIMITY ──
  checkInteractProximity();

  // ── ZONE EVENTS (narrative) ──
  if (zone === 1 && gameTime > 15 && !z2HintShown) {
    z2HintShown = true;
    sub('Una puerta al fondo de la carpa... Camina hacia ella y pulsa E.', 6000);
  } else if (zone === 2 && !z3HintShown) {
    z3HintShown = true;
    setTimeout(() => sub('Al final del pasillo... una puerta que no debería estar ahí.', 5000), 3000);
  } else if (zone === 3 && !climaxTriggered) {
    climaxTriggered = true;
    sub('¿Esto es... el exterior? No... las paredes están pintadas. Es un cuarto enorme.', 6000);
    setTimeout(() => sub('La realidad se distorsiona... y algo te observa desde las colinas.', 6000), 7000);
    // REMOVIDO: Se quitó el fin de juego automático para permitir exploración libre de las casas y colinas.
  }

  // ── CAMERA SHIVER (TEMBLOR SENSORIAL) ──
  const originalCamPos = camera.position.clone();
  const originalCamRot = camera.rotation.clone();
  
  if (miedo > 0.4) {
    const shiverFactor = (miedo - 0.4) / 0.6;
    const shiverPosIntensity = shiverFactor * 0.035;
    const shiverRotIntensity = shiverFactor * 0.012;
    
    camera.position.x += (Math.random() - 0.5) * shiverPosIntensity;
    camera.position.y += (Math.random() - 0.5) * shiverPosIntensity;
    camera.position.z += (Math.random() - 0.5) * shiverPosIntensity;
    
    camera.rotation.x += (Math.random() - 0.5) * shiverRotIntensity;
    camera.rotation.y += (Math.random() - 0.5) * shiverRotIntensity;
    camera.rotation.z += (Math.random() - 0.5) * shiverRotIntensity * 0.5;
    camera.updateMatrixWorld();
  }

  // ── RENDER ──
  if (vrEnabled) {
    renderSBS();
  } else {
    composer.render();
  }
  
  camera.position.copy(originalCamPos);
  camera.rotation.copy(originalCamRot);
  camera.updateMatrixWorld();
}

loop();
console.log('✅ Circo Interior iniciado');
</script>
